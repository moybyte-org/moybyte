name: Firmware build

# Build the ESP32 firmware images on GitHub's runners -- no always-on box needed.
# The .bin images drop out as downloadable artifacts on each run, and land on a
# rolling release per BRANCH (see the publish job).
#
# WHEN THIS RUNS -- the two branches are the two release channels (CLAUDE.md ->
# "Branches and releases"):
#
#   push to master  -> a STABLE build  -> the `firmware-latest` release, which is
#                      what the project site's flasher writes and what the
#                      device's STABLE OTA channel offers. A release is worth a
#                      build every time, so this is automatic.
#   push to dev     -> a BETA build    -> the `firmware-beta` release + the
#                      UNSTABLE OTA channel. Opt-in, rollback-protected, and the
#                      whole point of having a dev branch that testers can reach.
#   dispatch        -> whatever board you pick, from whatever ref: an unpublished
#                      one-off .bin (only the two branches above publish).
#
# Path-filtered, so a docs-only push builds nothing. Every-push-builds is
# affordable because the `concurrency` block below cancels in progress per ref:
# a burst of ten dev pushes collapses into ONE build of the last commit. If that
# ever stops being true (long queues, a slow runner), the smallest fix is to
# narrow this to a `schedule:` nightly on dev and leave master on push.
on:
  push:
    branches: [master, dev]
    paths:
      - "firmware/**"
      - "runtime/**"
      - "system_carts/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:
    inputs:
      board:
        description: "Which board(s) to build"
        type: choice
        default: tdeck
        options: [tdeck, p4, both]

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        board: [tdeck, p4]
    # Only run the boards the dispatcher asked for. A PUSH sets no input, so a
    # branch build does both boards; a dispatch honours the choice.
    env:
      WANT: ${{ github.event.inputs.board || 'both' }}
      IDF_CCACHE_ENABLE: "1"
      MOYBYTE_BUILD_JOBS: "4"
      MOYBYTE_SKIP_VFS_BOOT: "1"
      # The image's baked OTA identity (#53): build.sh stamps CHANNEL/VERSION/
      # LABEL into a generated _ota_build.py from this. Deriving it from the REF
      # is the whole point of the branch split -- an image built off dev must not
      # introduce itself to a device as a stable release. master keeps the
      # committed FIRMWARE_VERSION; unstable stamps a build epoch, so every beta
      # publish reads as newer than the last.
      MOYBYTE_OTA_CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'unstable' }}
    steps:
      - name: Should this board run?
        id: gate
        run: |
          if [ "$WANT" = "both" ] || [ "$WANT" = "${{ matrix.board }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping ${{ matrix.board }} (dispatcher chose: $WANT)"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # ESP-IDF + toolchains + the build tree are large; reclaim ~30 GB first.
      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false

      - name: ESP-IDF host prerequisites
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 \
            python3 python3-venv python3-pip

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the installed Xtensa/RISC-V toolchains + ccache (the expensive parts);
      # the .build/ clone itself is too big for the 10 GB cache, so it is fetched fresh.
      - name: Cache ESP-IDF toolchains + ccache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.ccache
          key: idf-${{ matrix.board }}-${{ runner.os }}-v1
          restore-keys: idf-${{ matrix.board }}-${{ runner.os }}-

      # pip wheels for `make setup` -- small, safe, keyed on the dependency spec.
      - name: Cache pip
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # The BIG win: cache the per-board `.build` UPSTREAM CLONES (esp-idf +
      # micropython + lvgl_micropython). They are PINNED in build.sh, so an
      # otherwise-fresh runner re-clones ~1.5 GB of esp-idf on every run -- and for
      # the T-Deck that late esp-idf fetch is exactly why the build had to run
      # twice (the #43 patch can't land until esp-idf exists). Keyed on build.sh so
      # a pin bump busts it; scoped per board so the two matrix legs don't evict
      # each other. The heavy esp32 port `build-*` object dirs are EXCLUDED (ccache
      # already covers recompiles) to keep each cache source-sized. A miss == today.
      #
      # The key hashes build.sh AND patches/** -- both determine the cached source
      # (the .patch files are applied into esp-idf under a one-shot MARKER guard, so
      # a restored tree already carries them and would NOT be re-patched). For the
      # same reason there is deliberately NO restore-keys here: a partial-key
      # fallback could restore a stale-patched tree that the marker then skips. Exact
      # key only -- any build.sh/patch change forces one clean (uncached) rebuild.
      - name: Cache T-Deck build tree (esp-idf + micropython clones)
        if: steps.gate.outputs.run == 'true' && matrix.board == 'tdeck'
        uses: actions/cache@v4
        with:
          path: |
            firmware/lilygo_t_deck_plus_micropython/.build
            !firmware/lilygo_t_deck_plus_micropython/.build/lvgl_micropython/lib/micropython/ports/esp32/build-*
          key: build-tdeck-${{ runner.os }}-${{ hashFiles('firmware/lilygo_t_deck_plus_micropython/build.sh', 'firmware/lilygo_t_deck_plus_micropython/patches/**') }}

      - name: Cache ESP32-P4 build tree (esp-idf + micropython clones)
        if: steps.gate.outputs.run == 'true' && matrix.board == 'p4'
        uses: actions/cache@v4
        with:
          path: |
            firmware/esp32_p4_wifi6_touch_lcd_7b/.build
            !firmware/esp32_p4_wifi6_touch_lcd_7b/.build/micropython/ports/esp32/build-*
          key: build-p4-${{ runner.os }}-${{ hashFiles('firmware/esp32_p4_wifi6_touch_lcd_7b/build.sh', 'firmware/esp32_p4_wifi6_touch_lcd_7b/patches/**') }}

      - name: Host venv (make setup)
        if: steps.gate.outputs.run == 'true'
        run: make setup

      - name: Build T-Deck (S3) firmware
        if: steps.gate.outputs.run == 'true' && matrix.board == 'tdeck'
        run: |
          # A from-scratch .build fetches esp-idf DURING the first pass, so the
          # #43 PSRAM-TX-DMA patch only lands on the second run -> build twice
          # (ccache makes the second pass fast) so the shipped image is patched.
          # But when the `.build` cache above restored esp-idf, the patch lands on
          # the FIRST pass, so the second full build is unnecessary -- skip it.
          # NB: check esp-idf presence BEFORE the first build (the first build
          # fetches it, so it always exists afterwards).
          IDF=firmware/lilygo_t_deck_plus_micropython/.build/lvgl_micropython/lib/esp-idf/export.sh
          if [ -f "$IDF" ]; then WARM=1; else WARM=0; fi
          make firmware-build-lilygo-micropython
          if [ "$WARM" = "0" ]; then
            echo "== cold .build: esp-idf was fetched mid-build, running a second (patched) pass"
            make firmware-build-lilygo-micropython
          else
            echo "== warm .build cache: esp-idf present up front, single pass is patched -- skipping second build"
          fi

      - name: Build ESP32-P4 firmware
        if: steps.gate.outputs.run == 'true' && matrix.board == 'p4'
        run: make firmware-build-p4

      - name: Collect images
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p out
          # T-Deck images land under firmware/*/dist/; the P4 build writes to
          # the repo-root dist/p4/ -- scan both (dist/ may not exist).
          find firmware dist -path '*dist/*' -name '*.bin' -print -exec cp {} out/ \; 2>/dev/null || true
          # The OTA identity build.sh stamped INTO this image (channel/version/
          # label). It rides along so the publish job writes a manifest whose
          # version is the one actually baked in, rather than re-deriving it a
          # job later: a beta's version is a build-time epoch, and a manifest
          # advertising a DIFFERENT number than the image carries would offer
          # the same install forever (install -> running version is lower than
          # the manifest again -> offered again).
          cp firmware/lilygo_t_deck_plus_micropython/dist/current/ota_build.json out/ 2>/dev/null || true
          ls -l out || true

      # 90 days rather than the old 14. Artifacts are no longer where the
      # website gets its images (that is the release below, which never
      # expires), but they are still the fallback and the by-hand download, and
      # this workflow is dispatched rarely enough that a fortnight is nothing.
      - name: Upload firmware artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moybyte-firmware-${{ matrix.board }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

  # Publish this run's images to a rolling release: the durable store the
  # website's flasher and the device's OTA both read. A release costs a clone
  # nothing, unlike committing 7.4 MB of .bin per build into a 6 MB repository.
  #
  # ONE release per branch/channel, and they never mix:
  #   master -> firmware-latest  (STABLE: the site's flasher + the stable OTA)
  #   dev    -> firmware-beta    (BETA:   the unstable OTA channel only -- the
  #                               site keeps flashing stable, see pages.yml)
  # Each carries a per-channel `latest.json` OTA manifest beside the images, so
  # the two channels are served by GitHub and a beta tester needs no host of
  # their own (`make ota-publish-unstable` stays the LAN/offline path).
  #
  # Per board and additive: only the boards THIS run built are replaced, so a
  # single-board dispatch leaves the other board's published image alone. The
  # Pages workflow watches this workflow and republishes the site afterwards --
  # for master only, since dev never changes what the site serves.
  publish:
    name: publish to ${{ github.ref == 'refs/heads/master' && 'firmware-latest' || 'firmware-beta' }}
    needs: build
    # always(): one board failing must not withhold the other's image. With
    # nothing built at all, the publish step finds no artifacts and no-ops.
    # Dispatched runs off other refs build but never publish -- an unreviewed
    # branch must not be able to hand itself to a device.
    if: >-
      always() &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run's images
        uses: actions/download-artifact@v4
        continue-on-error: true          # nothing built -> nothing to publish
        with:
          path: artifacts
          pattern: moybyte-firmware-*

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'unstable' }}
        run: |
          python3 tools/publish_firmware_release.py \
            --artifacts artifacts --channel "$CHANNEL"
