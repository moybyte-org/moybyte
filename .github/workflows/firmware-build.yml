name: Firmware build

# Build the ESP32 firmware images on GitHub's runners -- no always-on box needed.
# The .bin images drop out as downloadable artifacts on each run, and land on a
# rolling release per BRANCH (see the publish job).
#
# WHEN THIS RUNS -- the two branches are the two release channels (CLAUDE.md ->
# "Branches and releases"):
#
#   push to master  -> a STABLE build  -> the `firmware-latest` release, which is
#                      what the project site's flasher writes and what the
#                      device's STABLE OTA channel offers. A release is worth a
#                      build every time, so this is automatic.
#   push to dev     -> a BETA build    -> the `firmware-beta` release + the
#                      UNSTABLE OTA channel. Opt-in, rollback-protected, and the
#                      whole point of having a dev branch that testers can reach.
#   dispatch        -> whatever board you pick, from whatever ref: an unpublished
#                      one-off .bin (only the two branches above publish).
#
# Path-filtered, so a docs-only push builds nothing. Every-push-builds is
# affordable because the `concurrency` block below cancels in progress per ref:
# a burst of ten dev pushes collapses into ONE build of the last commit. If that
# ever stops being true (long queues, a slow runner), the smallest fix is to
# narrow this to a `schedule:` nightly on dev and leave master on push.
on:
  push:
    branches: [master, dev]
    paths:
      - "firmware/**"
      - "runtime/**"
      - "system_carts/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:
    inputs:
      board:
        description: "Which board(s) to build ('both' = all boards)"
        type: choice
        default: tdeck
        options: [tdeck, p4, guition_s3, both]

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The per-board facts every step below parameterizes on (#202 Phase A):
        # adding a board = adding a row (dir + make target); no later step
        # names a board. `patches/**` (repo root) rides every key because both
        # builds apply shared patches under one-shot marker guards.
        include:
          - board: tdeck
            dir: firmware/lilygo_t_deck_plus_mainline
            make_target: firmware-build-tdeck-mainline
          - board: p4
            dir: firmware/esp32_p4_wifi6_touch_lcd_7b
            make_target: firmware-build-p4
          - board: guition_s3
            dir: firmware/guition_jc3248w535
            make_target: firmware-build-guition-s3
    # Only run the boards the dispatcher asked for. A PUSH sets no input, so a
    # branch build does both boards; a dispatch honours the choice.
    env:
      WANT: ${{ github.event.inputs.board || 'both' }}
      IDF_CCACHE_ENABLE: "1"
      MOYBYTE_BUILD_JOBS: "4"
      MOYBYTE_SKIP_VFS_BOOT: "1"
      # The image's baked OTA identity (#53): build.sh stamps CHANNEL/VERSION/
      # LABEL into a generated _ota_build.py from this. Deriving it from the REF
      # is the whole point of the branch split -- an image built off dev must not
      # introduce itself to a device as a stable release. master keeps the
      # committed FIRMWARE_VERSION; unstable stamps a build epoch, so every beta
      # publish reads as newer than the last.
      MOYBYTE_OTA_CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'unstable' }}
      # The browser console is BAKED INTO the image (moy_web), and a published
      # image whose web console is missing is exactly the silent drift that
      # baking it was meant to end -- so here it is a hard failure, not the
      # warning a local flash gets. Set this to 0 to publish without one.
      MOYBYTE_REQUIRE_WEB_BUNDLE: "1"
    steps:
      - name: Should this board run?
        id: gate
        run: |
          if [ "$WANT" = "both" ] || [ "$WANT" = "${{ matrix.board }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping ${{ matrix.board }} (dispatcher chose: $WANT)"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # ESP-IDF + toolchains + the build tree are large; reclaim ~30 GB first.
      - name: Free disk space
        if: steps.gate.outputs.run == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false

      - name: ESP-IDF host prerequisites
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 \
            python3 python3-venv python3-pip

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the installed Xtensa/RISC-V toolchains + ccache (the expensive parts);
      # the .build/ clone itself is too big for the 10 GB cache, so it is fetched fresh.
      - name: Cache ESP-IDF toolchains + ccache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.ccache
          key: idf-${{ matrix.board }}-${{ runner.os }}-v1
          restore-keys: idf-${{ matrix.board }}-${{ runner.os }}-

      # A restored ~/.espressif carries python_env/idf5.5_pyX.Y_env whose
      # bin/python3 is a SYMLINK into /opt/hostedtoolcache. `Free disk space`
      # above wipes that tool cache (tool-cache: true) and `Set up Python` then
      # DOWNLOADS a fresh build, so the symlink dangles -- and `python -m venv`
      # over a broken env exits 1 with NO stderr, which is exactly how both
      # boards failed on 2026-08-17, twice, with warm caches. The tell is
      # idf_tools printing "No such file or directory: .../bin/python3" and then
      # failing to create the replacement.
      #
      # `make setup`'s own venv succeeds in the same job, which is what proves
      # the interpreter is fine and the TARGET is what is broken.
      - name: Drop a stale ESP-IDF python_env (dangling interpreter symlink)
        if: steps.gate.outputs.run == 'true'
        run: |
          shopt -s nullglob
          for env in "$HOME"/.espressif/python_env/*/; do
            if [ ! -x "${env}bin/python3" ]; then
              echo "== removing broken ESP-IDF venv: ${env}"
              rm -rf "${env}"
            fi
          done

      # pip wheels for `make setup` -- small, safe, keyed on the dependency spec.
      - name: Cache pip
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # The BIG win: cache the per-board `.build` UPSTREAM CLONES (esp-idf +
      # micropython). They are PINNED in build.sh, so an
      # otherwise-fresh runner re-clones ~1.5 GB of esp-idf on every run -- and for
      # the T-Deck that late esp-idf fetch is exactly why the build had to run
      # twice (the #43 patch can't land until esp-idf exists). Keyed on build.sh so
      # a pin bump busts it; scoped per board so the two matrix legs don't evict
      # each other. The heavy esp32 port `build-*` object dirs are EXCLUDED (ccache
      # already covers recompiles) to keep each cache source-sized. A miss == today.
      #
      # The key hashes build.sh AND patches/** -- both determine the cached source
      # (the .patch files are applied into esp-idf under a one-shot MARKER guard, so
      # a restored tree already carries them and would NOT be re-patched). For the
      # same reason there is deliberately NO restore-keys here: a partial-key
      # fallback could restore a stale-patched tree that the marker then skips. Exact
      # key only -- any build.sh/patch change forces one clean (uncached) rebuild.
      # ONE cache step for any board (the paths/keys come from the matrix row).
      # The key hashes everything that determines the cached tree's patched
      # state: the board's build.sh + its own patches dir (empty on boards
      # without one), the SHARED patches/, and the shared build spine + stager
      # (tools/esp32_build_lib.sh / board_config.py) that build.sh now runs
      # through -- a lib edit must bust the cache exactly as a build.sh edit
      # does, or a restored tree silently keeps the old patch under its marker.
      - name: Cache board build tree (esp-idf + micropython clones)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.dir }}/.build
            !${{ matrix.dir }}/.build/micropython/ports/esp32/build-*
          key: build-${{ matrix.board }}-${{ runner.os }}-${{ hashFiles(format('{0}/build.sh', matrix.dir), format('{0}/patches/**', matrix.dir), 'patches/**', 'tools/esp32_build_lib.sh', 'tools/board_config.py') }}

      # The wasm toolchain, shared with the Pages workflow by key (~1.8 GB:
      # emsdk + a micropython checkout, both pinned by web_runner/build.sh).
      - name: Cache the wasm toolchain
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: firmware/web_runner/.build
          key: web-runner-${{ runner.os }}-${{ hashFiles('firmware/web_runner/build.sh') }}
          restore-keys: web-runner-${{ runner.os }}-

      - name: Host venv (make setup)
        if: steps.gate.outputs.run == 'true'
        run: make setup

      # The firmware now CARRIES the browser console (moy_web), so the wasm
      # head has to be built before the board image that embeds it -- otherwise
      # the generator has nothing to bake and MOYBYTE_REQUIRE_WEB_BUNDLE fails
      # the build. Deliberately NOT continue-on-error: an image published to
      # the OTA channels must serve a console current with itself, which was
      # the entire point (a board once served a bundle old enough to carry a
      # bug fixed hours earlier, and nothing said so).
      - name: Build the browser console (baked into the image)
        if: steps.gate.outputs.run == 'true'
        run: firmware/web_runner/build.sh

      # ONE build step for any board. The cold-cache double build is belt and
      # braces: the shared spine clones esp-idf BEFORE the patch ladder runs,
      # so a single pass should already be fully patched -- but a second pass
      # on a cache miss is nearly free under ccache and guarantees it, on
      # every board uniformly.
      - name: Build ${{ matrix.board }} firmware
        if: steps.gate.outputs.run == 'true'
        run: |
          IDF=${{ matrix.dir }}/.build/esp-idf/export.sh
          if [ -f "$IDF" ]; then WARM=1; else WARM=0; fi
          make ${{ matrix.make_target }}
          if [ "$WARM" = "0" ]; then
            echo "== cold .build: esp-idf was fetched this pass -- second (guaranteed-patched) pass"
            make ${{ matrix.make_target }}
          else
            echo "== warm .build cache: single pass is patched"
          fi

      - name: Collect images
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p out
          # T-Deck images land under firmware/*/dist/; the P4 build writes to
          # the repo-root dist/p4/ -- scan both (dist/ may not exist).
          find firmware dist -path '*dist/*' -name '*.bin' -print -exec cp {} out/ \; 2>/dev/null || true
          # The OTA identity build.sh stamped INTO this image (channel/version/
          # label). It rides along so the publish job writes a manifest whose
          # version is the one actually baked in, rather than re-deriving it a
          # job later: a beta's version is a build-time epoch, and a manifest
          # advertising a DIFFERENT number than the image carries would offer
          # the same install forever (install -> running version is lower than
          # the manifest again -> offered again).
          # BOTH boards, and the P4's does not live under firmware/ -- shipping
          # only the T-Deck's is what published a P4 beta stamped "stable v2"
          # while its manifest said "unstable": the publisher found no stamp for
          # that board and fell back to the committed FIRMWARE_VERSION, so every
          # P4 on beta was offered the same install forever, which is the exact
          # failure the paragraph above exists to prevent.
          cp dist/tdeck_mainline/ota_build.json out/ 2>/dev/null || true
          cp dist/p4/ota_build.json out/ 2>/dev/null || true
          cp dist/guition_s3/ota_build.json out/ 2>/dev/null || true
          ls -l out || true
          # A build whose identity did not travel would publish a manifest that
          # lies about the image, so say it loudly rather than shipping it.
          test -f out/ota_build.json || echo "::warning::no ota_build.json for ${{ matrix.board }} -- the manifest will fall back to the committed version"

      # 90 days rather than the old 14. Artifacts are no longer where the
      # website gets its images (that is the release below, which never
      # expires), but they are still the fallback and the by-hand download, and
      # this workflow is dispatched rarely enough that a fortnight is nothing.
      - name: Upload firmware artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moybyte-firmware-${{ matrix.board }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

  # Publish this run's images to a rolling release: the durable store the
  # website's flasher and the device's OTA both read. A release costs a clone
  # nothing, unlike committing 7.4 MB of .bin per build into a 6 MB repository.
  #
  # ONE release per branch/channel, and they never mix:
  #   master -> firmware-latest  (STABLE: the site's flasher + the stable OTA)
  #   dev    -> firmware-beta    (BETA:   the unstable OTA channel only -- the
  #                               site keeps flashing stable, see pages.yml)
  # Each carries a per-channel `latest.json` OTA manifest beside the images, so
  # the two channels are served by GitHub and a beta tester needs no host of
  # their own (`make ota-publish-unstable` stays the LAN/offline path).
  #
  # Per board and additive: only the boards THIS run built are replaced, so a
  # single-board dispatch leaves the other board's published image alone. The
  # Pages workflow watches this workflow and republishes the site afterwards --
  # for master only, since dev never changes what the site serves.
  publish:
    name: publish to ${{ github.ref == 'refs/heads/master' && 'firmware-latest' || 'firmware-beta' }}
    needs: build
    # always(): one board failing must not withhold the other's image. With
    # nothing built at all, the publish step finds no artifacts and no-ops.
    # Dispatched runs off other refs build but never publish -- an unreviewed
    # branch must not be able to hand itself to a device.
    if: >-
      always() &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download this run's images
        uses: actions/download-artifact@v4
        continue-on-error: true          # nothing built -> nothing to publish
        with:
          path: artifacts
          pattern: moybyte-firmware-*

      # Signing the manifest is what stops a network attacker handing a board
      # their own firmware (moy_ota's ssl does not verify certificates, and the
      # manifest's sha256 cannot help against whoever wrote the manifest). The
      # key lives here as a repository secret; with it unset the publish still
      # succeeds and says so, and devices simply refuse the result.
      - name: Signing dependencies
        run: python3 -m pip install --quiet 'cryptography>=41'

      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'unstable' }}
          MOYBYTE_OTA_SIGNING_KEY: ${{ secrets.MOYBYTE_OTA_SIGNING_KEY }}
        run: |
          python3 tools/publish_firmware_release.py \
            --artifacts artifacts --channel "$CHANNEL"
