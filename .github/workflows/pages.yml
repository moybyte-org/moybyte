# The project site (GitHub Pages): the README's claims, plus the console itself
# running in the page.
#
# The centrepiece is a REAL build, not a recording -- site/build.py embeds
# firmware/web_runner/dist, so this workflow has to compile MicroPython to
# WebAssembly before assembling the page. That is the slow part: build.sh clones
# and installs emsdk (~1.7 GB) the first time. It is cached, keyed on build.sh,
# so only a change to the build itself pays for it again.
#
# The page also FLASHES a board over USB, so this job carries the firmware too:
# it pulls each board's image out of the rolling `firmware-latest` release and
# site/build.py publishes it under _site/firmware/. That copy is not a
# convenience -- GitHub serves neither Actions artifacts nor release assets with
# CORS headers, so a browser cannot fetch a firmware image from anywhere but the
# page's own origin (tools/fetch_ci_firmware.py explains it at length). This
# workflow WATCHES the firmware one (the `workflow_run` trigger below), so a new
# board build republishes the site around it.
#
# Deploys on a push to master that touches the site, the console, the web runner
# or the README -- and on demand. If the wasm build ever fails, the page still
# assembles (build.py says so in place of the player) rather than publishing
# nothing.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "runtime/**"
      - "system_carts/**"
      - "firmware/web_runner/**"
      - "tools/fetch_ci_firmware.py"
      - "README.md"
      - ".github/workflows/pages.yml"
  # A finished firmware build is new content for this site, so republish around
  # it instead of waiting for the next unrelated site push. (Only on success --
  # see the job's `if`; this event fires on every conclusion.)
  workflow_run:
    workflows: ["Firmware build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # list + download the firmware build's artifacts

# One deploy at a time, and never cancel one midway: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Every trigger except a FAILED firmware build (which has nothing new to
    # publish and would only burn a wasm build).
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      player: ${{ steps.player.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # emsdk + the micropython clone, keyed on the build script that pins them.
      # ~1.8 GB, comfortably inside the 10 GB repo cache (unlike the board
      # builds, which need the whole ESP-IDF and cache only their toolchains).
      - name: Cache the wasm toolchain
        uses: actions/cache@v4
        with:
          path: firmware/web_runner/.build
          key: web-runner-${{ runner.os }}-${{ hashFiles('firmware/web_runner/build.sh') }}
          restore-keys: web-runner-${{ runner.os }}-

      - name: Build the browser console
        id: player
        continue-on-error: true
        run: firmware/web_runner/build.sh

      # The images the page's flasher writes: the `firmware-latest` release,
      # falling back per board to a live run artifact. A board with nothing
      # published yet is an ordinary outcome (the firmware workflow is
      # dispatched by hand) and the page says so per board -- so a failure here
      # must not stop the deploy. It only fails outright if `gh` is broken.
      - name: Fetch the firmware images
        id: firmware
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_ci_firmware.py --out dist/ci-firmware

      - name: Assemble the site
        run: python3 site/build.py --out _site --firmware dist/ci-firmware

      - name: Note a missing player
        if: steps.player.outcome == 'failure'
        run: echo "::warning::the wasm build failed -- the site publishes without the live player"

      - name: Note missing firmware
        if: steps.firmware.outcome == 'failure'
        run: echo "::warning::could not fetch CI firmware -- the site publishes without the flasher"

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publish first, THEN go red. The first deploy shipped a page whose "Try it,
  # right here" section was an error box -- build.sh died on a cold clone -- and
  # the run was green, because continue-on-error makes a step's *conclusion*
  # success even when its outcome is failure. Keeping the page publishable is
  # right (a stale player beats no site); reporting it as fine is not. This runs
  # after deploy so the site still goes out, and fails the run so the red X is
  # visible without reading logs.
  player-check:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: The page shipped without its player
        if: needs.build.outputs.player == 'failure'
        run: |
          echo "::error::the wasm build failed -- the site is live but the player is an error box"
          exit 1
      - name: Player is present
        if: needs.build.outputs.player != 'failure'
        run: echo "player built and shipped"
