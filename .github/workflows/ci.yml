name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: make setup

      - name: Run tests
        run: make test

      - name: Check portable examples
        run: make check-portable

      - name: Run tiny runner headless
        run: make run-headless

      - name: Compile blocks demo
        run: make compile-blocks

      - name: Run generated blocks demo
        run: .venv/bin/kidcode run examples/blocks_demo.kcproj --entry generated/main.generated.py --headless --frames 60

      - name: Run music player stub
        run: .venv/bin/kidcode run examples/music_player_stub.kcproj --headless --frames 30

      - name: Run radio pong stub
        run: .venv/bin/kidcode run examples/radio_pong_stub.kcproj --headless --frames 30
