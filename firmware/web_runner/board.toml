#  Moybyte board definition -- the WEB RUNNER (MicroPython-WASM, #151)
#  ===================================================================
#
#  The third target's board file, and the LAST hand-rolled staging list to go
#  (#161): the boards moved their `cp` lists into board.toml in Phase 3, while
#  this build kept an inline `DENY="..."` string in build.sh -- the very shape
#  whose reasons live in commit messages instead of beside the data. The set
#  below is that DENY, verbatim, with each exclusion's why written down;
#  `tests/test_staging_closure.py` derives the web frozen set from THIS FILE
#  now, exactly as it does for the boards.
#
#  What this file does NOT cover: the emscripten usermod staging (moy_gfx /
#  moy_lua / moy_audio / moycore / moy_png / moy_wasm_web ride micropython.mk
#  fragments into the wasm port, structurally unlike the boards' USER_C_MODULES
#  cmake), the runner's own authored modules (web_boot.py /
#  web_canvas.py / gpio_link.py / update_link.py / carts_link.py / web_p8.py),
#  which build.sh copies by name the way a board's tracked modules/ files
#  simply exist -- and the p8 importer
#  (#194), the one set of modules staged out of `tools/`: the two VENDORED files
#  (the asset converter and the Lua porter) and the guards/report file it shares
#  with the CLI, plus shims/zlib.py. The stager
#  maps runtime/ and device/ and has no third source; build.sh carries those
#  three with the reason written beside the copy. The boards' WebAssembly
#  engine (native/moy_wasm, WAMR) is deliberately not among those usermods: the
#  browser runs a compiled cart as a sibling module on its own engine, never an
#  engine inside the engine, and native/moy_wasm_web is that engine's session
#  surface (its README).

[board]
name = "web_runner"
chip = "wasm32"
tier = "browser"
tier_why = """
The browser runs BOTH board arrangements: handheld (one canvas, system IS
game) and desktop (big system canvas + a real 320x240 game canvas +
blit_game), picked at boot. So unlike the S3 it stages wm_windowed.py, and
unlike both boards it keeps host_api.py -- deliberately
portable, the wasm head's cart API -- and input.py, the host InputState
web_input decodes into."""
font_tier = ["handheld", "desktop"]
font_why = """
`tools/make_font.py module` freezes the board's font set as `fonts_data`, the
way every console board does, with the icon sets' files beside it
(tools/make_icons.py). The browser runs both board arrangements, each on its
board's metric class: the handheld 320x240 declares no glass, as the T-Deck
declares none, so it lays out on the handheld's metrics
(`layout_base.class_of(None)`); the 1024x600 desk declares the Waveshare P4's
7-inch glass (`web_boot.DESK_DIAGONAL_IN`), so it lays out on the desk's. The
image therefore carries both tiers' faces and icon masks, the union of what
the T-Deck and the P4 freeze, and `iconsets.carried` and every theme role
resolve here as on that board's glass (tests/test_web_look_parity.py holds
the sets and the number to the boards', tests/test_web_fonts.py runs the
real wasm in both arrangements)."""

# ---------------------------------------------------------------------------

[modules]
# The stage dir is BUILD OUTPUT, demolished by build.sh (`rm -rf`) before every
# stage -- so unlike the boards' gitignored-but-persistent modules/ there is
# nothing for a prune to catch, and prune stays off.
dest  = ".build/stage/modules"
prune = false

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY module under runtime/ (flat; a host/ folder never stages); name the
ones that must not cross, with the reason.
The web runner had this policy FIRST (its build.sh glob predates #161) -- what
moves here is the reasons, and the derivation tests/test_staging_closure.py
performs over them."""

# -- host-only: real code, real purpose, dead weight or wrong in the browser --

# runtime/host/ never stages (tools/board_config.py HOST_ONLY_DIR): the host's
# ctypes bindings, native build and simulator glue live there. What is denied
# below is host-side code that sits beside the shared modules.

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- this file no longer exists. `runtime/palette.py` built MOY64 with
CPython's `colorsys` at import time, which MicroPython has none of (on glass
2026-08-15 `import palette` raised ImportError, and the Appearance screen's
cart-wallpaper panel drew nothing). Deleted 2026-11-01: libmoy's `moy_data.c`
is the table, `device_canvas.PAL565`/`MOY64_RGB` its baked twins. Named so
that its return is a decision."""

[[modules.shared.deny]]
file = "dev_http.py"
kind = "tier"
why  = """
A device API's face (runtime/system/devices.py): the browser has no hardware
of its own (docs/os_2026-11/hardware.md section 1) and its images compile no
device driver, so `moybyte.http` answers None there."""

