#  Moybyte board definition -- LilyGO T-Deck Plus (ESP32-S3)
#  =========================================================
#
#  #161: a board's definition lives in six places in three languages, and the
#  first field to move here is the one that had already produced a bug -- the
#  STAGED MODULE LIST. Read `tools/board_config.py` for the mechanism; this
#  file is the declaration, and the prose belongs WITH it (#161: "whatever
#  moves, the prose rationale moves with it -- a board file with the
#  constraints stripped out is worse than what we have now").
#
#  Not here yet, deliberately: sdkconfig knobs (cache geometry, MSPI speed,
#  IRAM diet), the partition layout, the native usermod staging and the
#  patch ladder. They are still imperative in `build.sh`, with their reasoning
#  in comments beside them. #161 ranks them below this and they are a separate
#  phase; adding a half-declared knob here would make the board's truth live in
#  SEVEN places instead of six.

[board]
name    = "lilygo_t_deck_plus"
chip    = "esp32s3"
ota     = "tdeck"           # the board id inside a signed OTA manifest (#53)
tier    = "handheld"
tier_why = """
320x240, ONE canvas: the system surface IS the game surface (console.py builds
them as the same object). That is what makes `wm.FullscreenStackWM` the right
window manager here and the windowed desktop tier wrong -- see the
`wm_windowed.py` denial below."""

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# `modules/` is BUILD OUTPUT plus a handful of board-authored files, and
# `freeze()` in the generated manifest freezes the whole DIRECTORY -- not the
# list build.sh copied. So a shared module that stops being staged keeps being
# frozen forever on any tree that has built before, which is the exact blind
# spot `tests/test_staging_closure.py` was written about. It is not
# hypothetical: on 2026-08-15 `canvas.py` and `palette.py` were removed from the
# staging list and both were still sitting in `modules/` (and therefore still
# in the image) on every warm checkout. So the stager PRUNES: any untracked
# `.py` in `modules/` that this file does not stage and `keep` does not name is
# deleted, loudly, at the top of every build.
prune = true
keep  = [
  # Generated later in build.sh, into the same directory.
  "carts_data.py",   # tools/gen_device_carts.py, from system_carts/
  "_ota_build.py",   # the OTA channel/version/label stamp (#53)
  "_moy_bench.py",   # MOYBYTE_BENCH=1 boot stamp (#63); build.sh rm -f's it
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY runtime/*.py; name the ones that must not cross, with the reason.

The other way round -- an explicit `cp` per module -- is what shipped here
until #161 Phase 3, and it answers the wrong question. An allowlist asks "did
somebody remember to add this?", so a new shared module is invisible to this
board until a human edits a shell script; a denylist asks "is there a reason
this must not cross?", which is a question with an answer someone can check.
The bug is never loud when it happens, because every consumer in this tree is
capability-gated: the web console shipped on the P4 and simply did not exist
on the T-Deck, and nothing went red.

`firmware/web_runner/build.sh` has always done it this way (its `DENY=` list);
this board and the P4 caught up. The completeness half is checked by
`tests/test_staging_closure.py`, which derives the frozen set from THIS FILE
and asserts every import of every staged module can resolve on this target."""

# -- host-only: real code, real purpose, impossible or wrong on a board ------

[[modules.shared.deny]]
file = "host_app.py"
kind = "host-only"
why  = """
The simulator's glue: a pygame window, the mouse/trackball ConsoleDriver, and
`build_workstation()`. It imports the host's world wholesale. Not a board."""

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The host's cart-API backend -- and the one denial here that is NOT about
"cannot import". host_api is deliberately portable (the web runner freezes it,
which is why HOST_ONLY in the closure test is per-target and not global), so
this board would import it happily and then have TWO make_api implementations
in one image: this one and `modules/device_api.py`, the authored device twin.
Two backends for one contract is the drift this repo exists to prevent."""

[[modules.shared.deny]]
file = "host_canvas.py"
kind = "host-only"
why  = """
Runs the BOARDS' canvas class on CPython -- it builds `DeviceCanvas` over a
ctypes compositor so the host stops having a second raster. The board has the
real one; this is the adapter that exists only because CPython isn't one."""

[[modules.shared.deny]]
file = "gfx_binding.py"
kind = "host-only"
why  = """
`moy_gfx` for CPython: compiles `moyhost_gfx.c` with a C compiler found at
runtime and dlopens it through ctypes. On device `moy_gfx` is a compiled-in
usermod. This is the host binding that would look MOST plausible to stage,
being the host half of the very module `device_canvas` imports."""

[[modules.shared.deny]]
file = "lua_binding.py"
kind = "host-only"
why  = """
ctypes over libmoy's Lua binding, compiled on demand -- the host's answer to
the `moy_lua`/`moycore` usermods this board compiles in."""

[[modules.shared.deny]]
file = "audio_binding.py"
kind = "host-only"
why  = """
ctypes over the vendored libmoy synth (#97 / moycore stage 0). The board's
synth is the `moy_audio` usermod, bound by `modules/device_audio.py`."""

[[modules.shared.deny]]
file = "native_build.py"
kind = "host-only"
why  = """
The shared compile-and-cache helper the three bindings above use: subprocess to
a C compiler, a hash-keyed .so cache under .build/. There is no compiler on a
board, and nothing to compile if there were."""

[[modules.shared.deny]]
file = "lua_host.py"
kind = "host-only"
why  = """
The host's Lua cart runner, over `lua_binding`. The device's runtime is
`moycore` (a usermod) driven by `moycore_glue.py`."""

[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`. The board's input contract is the frozen `moybyte`
PACKAGE (`modules/moybyte/input.py`) -- the T-Deck keyboard matrix, the raw/
ASCII mode flip, the trackball, and an InputState with a wider BUTTONS tuple.
Freezing both would put two classes of the same name in one image, and the
scripted-input suite already learned that lesson once: staging runtime/input.py
made it compare the host against the host (see test_semantic_traces.py, which
now copies the board's `moybyte/input.py` as `input`)."""

# -- never on a board: importing it RAISES, which reads as a missing feature --

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
Builds MOY64's indices 16-63 with CPython's `colorsys` at IMPORT time, and
MicroPython has none. VERIFIED ON P4 GLASS 2026-08-15 against firmware built
before it was unstaged: `import colorsys`, `import palette` and `import canvas`
all raise ImportError, and the consequence is visible one level up --
`wallpaper._ensure_preview()` returns False, `_static_preview()` returns None,
and the Appearance screen's cart-wallpaper panel drew its black fill and
nothing else, on both boards, for as long as it had existed. That is the shape
of the whole class: a module that raises on import is WORSE than one that is
missing, because every caller here is guarded, so it surfaces as a feature that
quietly does not exist. The web head needs the same table and GENERATES a
literal twin instead; a board that ever needs MOY64 should do the same."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- this file no longer exists. `runtime/canvas.py` was the pure-Python
indexed raster, deleted 2026-08-15 when the host moved onto
`device_canvas.DeviceCanvas` like every other tier. Its only device consumer
was the wallpaper preview runner, which could never import it here anyway (see
`palette`). The entry stays because a denylist tolerates naming a file that is
not there, and a second raster in frozen flash bought a preview nobody ever
saw. If this name comes back, it should be by decision."""

# -- tier: real on this repo's OTHER presentation tier, wrong on this one -----

[[modules.shared.deny]]
file = "wm_windowed.py"
kind = "tier"
why  = """
The Picotron-style WINDOWED desktop (#73/#105): the desk world, WM title
strips, drag/resize, per-window layout contexts, the taskbar. It is the P4's
and the host's presentation tier. This board is 320x240 and runs
`wm.FullscreenStackWM`, so the windowed WM is not a feature it lacks -- it is a
tier it is not. Excluded on purpose since the file was written; #161 Phase 3
only moved the exclusion from a shell script's silence into a line with a
reason on it."""

[[modules.shared.deny]]
file = "surface.py"
kind = "tier"
why  = """
Surface model v1's retained-surface object (docs/surface_model_v1.md §2). It is
a LEAF whose only importers are `wm_windowed.py` and the web serve glue -- never
`wm.py` or `console.py`, which this board freezes verbatim (spec L6). With
wm_windowed denied above, staging this would freeze bytes nothing imports.
`tests/test_surface_model.py` pins both halves of that claim."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
The transport-neutral half of the old web view: browser event batches ->
InputState/Pointer. It survived the 2026-08 streaming sunset because the plan's
§3.4 sync/controller RPC speaks the same `{"events":[...]}` format -- but that
RPC is not built, and today the only importer is the wasm head's `web_boot.py`.
FLIP THIS the day a board grows a consumer; until then it is dead bytes in
frozen flash. (`web_view_ws.py`, the RFC 6455 framing, is the opposite case and
IS staged: `moy_webserver.py` imports it through a two-branch ladder with no
third branch, and dropping it once already made the WEB CONSOLE row silently
not exist.)"""

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62). It stages as `moy_font` because that is the
name `device_canvas` imports before it will use the native `moy_gfx.text`
kernel -- so device text rasterizes from the SAME bytes the host draws from,
which is what makes pixel parity a fact rather than a hope. The rename is why
the closure test keys modules by DESTINATION name: keyed by source it would
think `import moy_font` was unsatisfied."""
