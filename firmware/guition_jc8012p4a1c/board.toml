#  Moybyte board definition -- Guition JC8012P4A1C (ESP32-P4 + C6, 10.1")
#  ====================================================================
#
#  The fifth build target and the second ESP32-P4 board (2026-09-06): a
#  VARIANT PORT of the Waveshare 7B -- same silicon class (P4 + C6 over SDIO
#  + a MIPI-DSI touch panel), so its board file is the Waveshare's with the
#  panel, the touch part and the flash size changed. What the two share as
#  DATA rather than as copies is the whole point of the port:
#  `[native.p4]` (the P4 silicon tier), the kernel's DSI compositors,
#  `device/p4_canvas.py`, and the device allowlist below.
#
#  Read `README.md` in this directory before touching the board: it holds
#  what this glass decided (800x1280 is PORTRAIT-NATIVE and the console runs
#  portrait on it, the GSL3680 is RAM-loaded, the backlight is active-high)
#  and what carried over from the Waveshare unchanged (the C6 wiring, the SD
#  slot on LDO4, the VFS-shadowing rule).

[board]
name    = "guition_jc8012p4a1c"
chip    = "esp32p4"
ota     = "guition_p4"      # the board id inside a signed OTA manifest (#53)
tier    = "desktop"
tier_why = """
800x1280 (portrait-native glass, run portrait -- README), TWO canvases: a big
system canvas plus a real 320x240 game canvas composited into a window
(`blit_game`) on the PPA, exactly the Waveshare's arrangement one size up.
That is what makes `wm_windowed.py` and its halves right here and
wrong on the S3 boards."""

[panel]
# The GLASS, in inches -- the opt-in to the chrome tap-target floor (#203),
# declared 2026-09-06 on the owner's verdict from the desk (the handheld-sized
# buttons were "too tiny" on a 10.1" that is touch-only; legibility was never
# the problem, tap size was), and what makes this board a DESK
# (`layout_base.class_of`, docs/history/look_2026-10.md step 9): the desk's metrics
# draw the handheld's 16px icons at 32, 5.4mm at ~150 PPI, over
# `chrome.MIN_TAP_MM`, so the floor is 1 and every glyph stays at font
# scale 1.
# `modules/moy_runtime.py`'s PANEL_DIAGONAL_IN carries this number to the
# console; tests/test_board_toml.py pins the two together.
diagonal_in = 10.1

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# `modules/` mixes board-authored files (tracked; see .gitignore) with
# build-staged copies, and the frozen manifest freezes the whole DIRECTORY
# rather than the list the stager copied -- so a module that stops being
# staged keeps being frozen on every tree that has built before (the
# Waveshare's board.toml has the live proof). The stager PRUNES untracked
# strays it did not just stage, loudly, at the top of every build.
prune = true
keep  = [
  "carts_data.py",   # generated by tools/gen_device_carts.py from system_carts/
  "fonts_data.py",   # tools/make_font.py, the tier's font set
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY module under runtime/ (flat; a host/ folder never stages); name the
ones that must not cross, with the reason.

An allowlist asks "did somebody remember to add this?"; a denylist asks "is
there a reason this must not cross?". The first question's wrong answer is
silent, because every consumer in this tree is capability-gated.

`tests/test_staging_closure.py` derives this board's frozen set from THIS FILE
and asserts every import of every staged module resolves on this target."""

# -- host-only: real code, real purpose, impossible or wrong on a board ------
#
# Identical to the Waveshare's and the T-Deck's list. That is a property worth
# noticing rather than a duplication to factor out: boards agreeing about
# which HOST modules are host-only is a claim each board makes for itself, and
# `tests/test_staging_closure.py` cross-checks that they agree.

# runtime/host/ never stages (tools/board_config.py HOST_ONLY_DIR): the host's
# ctypes bindings, native build and simulator glue live there. What is denied
# below is host-side code that sits beside the shared modules.

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeWifi + ConsoleDriver.
make_api itself is ONE body in the shared `cart_api.py` since 2026-08-17
(which DOES stage here; `device_api.py` re-exports it), so this denial is
about dead weight, not duplicate backends: nothing on a board constructs a
fake service or a sim driver."""

[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`: the host's eight names over the input table. A board
reads the kernel's table (`moy_input.kernel()`, all fifteen names), and nothing
it runs imports this file."""

# -- never on a board: importing it RAISES, which reads as a missing feature --

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- this file no longer exists. `runtime/palette.py` built MOY64 with
CPython's `colorsys` at import time, which MicroPython has none of (on glass
2026-08-15 `import palette` raised ImportError, and the Appearance screen's
cart-wallpaper panel drew nothing). Deleted 2026-11-01: libmoy's `moy_data.c`
is the table, `device_canvas.PAL565`/`MOY64_RGB` its baked twins. Named so
that its return is a decision."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- the file no longer exists. `runtime/canvas.py` was the pure-Python
indexed raster, deleted 2026-08-15 when the host moved onto
`device_canvas.DeviceCanvas`. Kept named so its return is a decision."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
Browser event batches -> InputState/Pointer. It survived the 2026-08 streaming
sunset because the plan's §3.4 sync/controller RPC speaks the same format, but
that RPC is not built and today's only importer is the wasm head's web_boot.py.
This board SERVES the wasm console (moy_webhost) -- it does not decode its
input. Flip this the day it does."""

# NOTE the two files that are NOT denied here and ARE on the S3 boards:
# `wm_windowed.py` and its halves. See [board].tier_why.

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62), staged under the name `device_canvas`
imports before it will use the native `moy_gfx.text` kernel -- so device text
rasterizes from the same bytes the host draws from."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py (#202 Phase A). The merged image flashes at
# 0x2000 (the P4's bootloader offset); otadata is at 0xd000 on this table
# (the Waveshare's table head, on 16MB instead of 32MB) and is erased first so a
# board that has taken an OTA boots the slot the cable flash just wrote.
# No `before`: this board flashes over the P4's OWN USB-Serial/JTAG (no
# external UART bridge), which esptool's default reset drives cleanly --
# measured 2026-09-06: chip_id, a 16MB read_flash and the first write_flash
# all connected first try with no BOOT button.
image          = "dist/guition_p4/moybyte_guition_p4.bin"
offset         = "0x2000"
baud           = 921600
otadata_offset = "0xd000"
otadata_size   = "0x2000"

[input]
# The input table's parameters, each a compile definition
# (tools/board_config.py INPUT_PARAMS). An ISR's event ring is internal RAM
# (native/moy_input/moy_event.h MOY_EV_ISR_DEPTH_MAX, 64 by default): a P4's
# internal RAM has room for a ring that covers a 2 kHz source across a
# collection (the rings spike in #246), so its ceiling is 1024 records, 16 KiB.
isr_ring_max = 1024
# The ISR writer's text is IRAM (moy_input.h MOY_INPUT_ISR_IRAM), so a lease
# pin's ISR stays hot through a collection; a board without it pays none.
isr_iram = 1

[image]
# The OTA-slot headroom this board's app image keeps, browser console baked in.
# The build FAILS under it (moybyte_app_size_guard, tools/esp32_build_lib.sh,
# MOYBYTE_ALLOW_UNDER_FLOOR=1 for an experiment). The headroom is the build's
# to print; the floor is the design.
# The slots were cut to 6 MiB for the kernel (owner, 2026-10-05; f738797). When
# the 2026-10 look's font set took the image near the floor they grew to
# 7.5 MiB on this board's 16 MB (owner, 2026-10-15): the theme fonts stay in the
# image, and the store (the card, the internal vfs its fallback) gives the room.
headroom_floor_kib = 1024

[serial]
# Read by tools/push_cart.py. THE LINE STATE AT OPEN IS BOARD-SPECIFIC AND
# LOAD-BEARING. This is the P4's own USB-Serial/JTAG (303a:1001), the
# arrangement the two S3 boards have and the Waveshare P4 does NOT: opening
# with dtr/rts LOW is a chip reset, after which the USB device re-enumerates
# under the open handle and every read returns nothing forever. Attach with
# both ASSERTED -- pyserial's default, and what miniterm does.
dtr         = true
rts         = true
# ATTACH ONLY: never pulse the line to reset (P4Board.reset() is the CH343
# board's verb; here it strands the handle). The on-glass suite attaches to
# the running desktop and leaves the console where it found it.
attach_only = true
# The SoC's own USB-Serial/JTAG id, SHARED with the T-Deck, the Guition S3
# and the Zero -- it narrows the candidates and cannot finish the job; the
# harness settles ambiguity by asking each candidate for its `_ota_build.BOARD`
# (safe here: attach_only boards open without resetting).
usb         = "303a:1001"
# USB backpressures, so the S3 boards' chunk and window carry over: the
# USB-Serial/JTAG ISR only drains what the stdin ring has room for, so the
# endpoint stalls and the HOST blocks -- the window buys fewer round trips,
# it is not the safety margin it is on the Waveshare's unflow-controlled UART.
# The board acks a window before writing it, and its stdin ring is
# MOY_SERIAL_RING_BYTES (mpconfigboard.h), twice the window, so the next window
# lands between the flash operations of the last one's write.
chunk       = 768
window      = 16384

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# THE HARDWARE (docs/os_2026-11/hardware.md section 1): every GPIO of the chip
# in exactly one row -- `os`, `class` (with the device API it names), `lease`,
# `never` -- or in `unused`. The pins are README.md's board map; the flash,
# the PSRAM, the MIPI lanes and the USB 2.0 port have pads of their own,
# outside the GPIO matrix. The `lease` row is every pin that map assigns
# nothing (README.md's "Free pins").

[hardware]
chip_gpio = "esp32p4"
unused = []

[[hardware.resource]]
name = "i2c0"
class = "os"
pins = {sda = 7, scl = 8, touch_rst = 22, touch_int = 21}
why = "the GSL3680 touch, the ES8311 and the ES7210 share it; the kernel's I2C master is its only driver"

[[hardware.resource]]
name = "speaker"
class = "os"
pins = {mclk = 13, bck = 12, ws = 10, dout = 9, pa = 20}
why = "the ES8311 codec and its amp, which the console's mix plays through (no speaker fitted on the owner's unit)"

[[hardware.resource]]
name = "panel"
class = "os"
pins = {lcd_rst = 27}
why = "the JD9365's reset; its DSI lanes are dedicated pads"

[[hardware.resource]]
name = "sdmmc0"
class = "os"
pins = {clk = 43, cmd = 44, d0 = 39, d1 = 40, d2 = 41, d3 = 42}
why = "the TF card, the cart store, brought up once and never torn down"

[[hardware.resource]]
name = "usb"
class = "never"
pins = [24, 25]
why = "the USB-Serial/JTAG the console, its dev channel and the flasher are reached through"

[[hardware.resource]]
name = "backlight"
class = "class"
api = "brightness"
pins = {bl = 23}

[[hardware.resource]]
name = "mic"
class = "class"
api = "mic"
bus = "i2c0"
pins = {din = 11}

[[hardware.resource]]
name = "c6"
class = "class"
api = ["http", "ble"]
pins = {clk = 18, cmd = 19, d0 = 14, d1 = 15, d2 = 16, d3 = 17, reset = 54}

[[hardware.resource]]
name = "camera"
class = "class"
api = "camera"
pins = []

[[hardware.resource]]
name = "usb_host"
class = "class"
api = "usb"
pins = []

[[hardware.resource]]
name = "gpio"
class = "lease"
pins = [0, 1, 2, 3, 4, 5, 6, 28, 29, 30, 31, 32, 33, 45, 46, 47, 48, 49, 50, 51, 52, 53]

[[hardware.resource]]
name = "uart1"
class = "lease"
bus = "gpio"
pins = {tx = 47, rx = 48}

[[hardware.resource]]
name = "spi2"
class = "lease"
bus = "gpio"
pins = {sck = 49, mosi = 50, miso = 51}

[[hardware.resource]]
name = "strap"
class = "never"
pins = [34, 35, 36, 37, 38]
why = "strapping; 37 and 38 are UART0, which nothing on this board uses"

[[hardware.resource]]
name = "usb_phy"
class = "never"
pins = [26]
why = "the full-speed OTG PHY's pad; its other pad, 27, is the panel's reset"

[native]
dest = "native/.staged"

[native.shared]
source   = "native"
why = """
The C-module twin of [modules.shared] (#161; see the T-Deck's board.toml for
the mechanism). Every directory under native/ with a micropython.cmake crosses
unless denied here. The denial is the Waveshare's, for the same hardware
reason. (native/p4/ has no micropython.cmake of its own, so this
scan never sees it -- that tier is the second source, [native.p4] below.)"""

[[native.shared.deny]]
module = "moy_flush"
why = """
There is no flush on this board to feed. moy_flush is the banded-flush engine
the two S3 boards share (core-0 feeder, two internal-SRAM bounce slots, the
kick/drain handoff) -- it exists because an SPI panel has to PUSH every frame.
The P4's panel is MIPI-DSI in DPI mode: the peripheral scans a PSRAM
framebuffer continuously, so there is no per-frame transfer, no band, no
bounce and no completion ISR. Staging it would compile a FreeRTOS task and a
DMA-SRAM allocation into the image for code nothing calls. A DSI board that
ever needs a push path is a new decision, not a flip of this one."""

[[native.shared.take]]
module = "moy_sd"
why = """
The card driver under the store's own card volume (docs/history/kernel_store_2026-10.md
slice 8): `moy_sd.mmc` brings the TF card up on SDMMC slot 0 (GPIO39-44, LDO4
powered; slot 1 is the C6's) once and never tears it down, and
native/moy_store's card -- the kernel's FATFS and read cache -- reads it
through `moy_sd_card_io`, with each transfer's bounce in PSRAM, which this
host's DMA reaches. `device/p4_desktop.p4_card` builds it and
`device/card_store.py` makes it the cart store when a card is in. The OTA
directory stays /moy/update on the internal VFS either way."""

[[native.shared.take]]
module = "moy_wasm"
why = """
The WebAssembly cart tier's engine (native/moy_wasm/README.md): the
vendored WAMR runtime, AOT only, and the thread a module runs on. The tier
ships on every console board or on none, so this board takes it. Its internal
SRAM is not the constraint the S3 boards' is; the on-glass suite runs the same
wasm checks. The run stack's size and placement are this board's MOY_WASM_*
settings in mpconfigboard.h, with the measurement that chose them."""

[[native.shared.take]]
module = "moy_play"
why = """
The kernel's Player (docs/history/kernel_cartpath_2026-10.md): the tick model, the
runtime map and the VM-free rule, and the module `moy_play`. Every console
takes it."""

[[native.shared.take]]
module = "moy_app"
why = """
The app ABI's kernel half (docs/history/kernel_appabi_2026-10.md): the grants, the
grant policy and the roles served in C, and the module `moy_app`; and the
user-files layer the files role is served over (native/moy_store/moy_ufiles.h,
the module `moy_ufiles`). Every console takes it."""

[[native.shared.take]]
module = "moy_ui"
why = """
The widget toolkit's bodies in C with style and strings as data
(docs/history/kernel_toolkit_2026-10.md), and the module `moy_ui` runtime/toolkit/ui.py's face
calls. Every console takes it."""

[[native.shared.take]]
module = "moy_kernel"
why = """
The kernel's entry, crash record and recovery floor
(native/moy_kernel/moy_kernel.c's header): taking it is what makes the kernel own
app_main. Every console takes it; what is this board's is in mpconfigboard.h --
the panel module's four entry points the floor draws through, and serial as
its only input, so with none for 30 s it starts SAFE."""

[[native.shared.take]]
module = "moy_glass"
why = """
The glass's native home (docs/history/kernel_survival_2026-10.md section 3): canvas
rows, the buffer table, the pool and present. It compiles to nothing until pass
1 of sprint 3 gives it its sources; it is taken now so that pass changes no
build list. Every console takes it."""

[[native.shared.take]]
module = "moy_input"
why = """
Input's native home (docs/history/kernel_survival_2026-10.md section 4): the merged
table, its sources and the drivers below them. It compiles to nothing until
pass 2 of sprint 3 gives it its sources; every console takes it."""

[[native.shared.take]]
module = "moy_net"
why = """
The links' native home (docs/history/kernel_survival_2026-10.md section 6): WiFi, the
link, the HTTP core, the webhost, the sync RPC and the updater. It compiles to
nothing until pass 2 of sprint 3 gives it its sources; every board with a radio
takes it."""


[native.p4]
source   = "native/p4"
why = """
The ESP32-P4 SILICON tier: the C modules an ESP32-P4 board has BECAUSE it is a
P4 -- moy_dsi (the MIPI-DSI panel; THIS board names MOY_DSI_PANEL_JD9365 in
its mpconfigboard.cmake and the module drives the JD9365 at 800x1280),
moy_ppa (the pixel accelerator behind the game composite) and moy_c6 (the
ESP-NOW shim + C6 plumbing over ESP-Hosted -- the C6 wiring here is the Waveshare's
pin for pin: SDIO CLK18/CMD19/D0-3 14-17, reset 54). This board is the
SECOND consumer that moved the tier out of the Waveshare's tree (2026-09-06,
Phase C of docs/board_ports_2026-08.md). Nothing is denied."""

# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
why = """
The second staging source, and the one that must STAY an allowlist.

`runtime/` is a shared tree by definition, so a denylist over it is safe: the
default answer is "yes, this crosses". `device/` is the boards' shared DEVICE
tier -- a repo-root tree since the fork's deletion (2026-08-17, `a02bb33`).
It stays an allowlist even so, because not every board drives every piece of
it: this board has no SPI-shared SD (`moybyte_sd.py` stays T-Deck-only), its
touch driver is the kernel's (native/moy_input), and the allowlist is
where that per-board difference is written down rather than discovered as a
frozen module nothing imports.

Each file named below is board-AGNOSTIC by construction, with its
board-specific imports guarded and its hardware inputs passed as constructor
arguments.

The boot spine is `runtime/boot/device_boot.py` and reaches this board through the
SHARED denylist above; the frame loop is the kernel's (`moy_kernel`).
The line that decides is whether a module can import with no board present:
both take every hardware object as an argument, so they load on CPython and
tests/test_device_boot.py executes their shared half."""
[[modules.device.group]]
files = ["boot_shell.py"]
why = """
The boot shell's mode ladder, which `modules/moybyte_shell.py` on this board is
now three declarations over: the board's name, the modes it has, and the module
its smokes live in. It was ~20 lines written once per board and byte-identical
after normalising those three, so the ONE-STRING rule, the self-terminating
smokes and the keep-the-REPL guards now land once instead of four times."""

[[modules.device.group]]
files = ["desktop_spine.py", "wire_input.py", "wire_links.py"]
why = """
The console desktop's boot spine: ONE `build_desktop` (the boot order and the
service set every console board wires) and ONE hand-over of the console to
the kernel's frame loop. The four boards' `run_desktop`s
carried the same imports, the same frame-loop construction,
the same `ws.*` service assignments and the same hook names in fifty-four
byte-identical lines each; a board now passes its hardware -- compositor,
canvas, inputs, keyboard, store, constants -- and takes the rest.

The spine constructs each subsystem through its provider: wire_input.py (the
pointer, the keyboards' start, a BLE-keyboard input state) and wire_links.py
(the radio link, the updaters, Get Carts' network, the web console). Audio has
no provider: the kernel's moy_audio needs no construction at boot."""

[[modules.device.group]]
files = ["mem_census.py"]
why = """
The memory census the spine marks its boot steps into: inert unless the flash
root holds `/mem_census` (written by `tools/mem_census.py`), which arms the
boot trace and the import timer. The spine imports it, so every board that
takes the spine takes it."""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py", "device_api.py", "moycore_glue.py"]
why = """
The drawing backend and the cart namespace: DeviceCanvas (the raster every tier
now runs, RGB565 with the palette resolved at draw time), `device_api` (the
device home of THE make_api -- one body in the shared cart_api.py since
2026-08-17, re-exported here), moycore's glue (the run's buffers and asset
texts handed to the C, its frame the kernel's Player's, pmem at the #66
boundaries), and the leaf ticks helpers
device_canvas imports."""

[[modules.device.group]]
files = ["p4_canvas.py", "p4_desktop.py", "card_store.py"]
why = """
The P4 silicon tier's Python half (2026-09-06, promoted out of the Waveshare's
moy_runtime.py the day this board became its second consumer): the SYSTEM
canvas with the PPA composite hooks the windowed WM probes for, and the desk's
boot. This board's compositor is the kernel's moy_glass.RotatedCompositor
(native/moy_glass), constructed by its moy_runtime.py at this glass's angle.
`card_store.py` is the cart store on a card that has a bus of its own
(tests/test_card_store.py executes it): the TF card when one mounts, the
internal flash when not."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "The WLAN service the console's Settings WIFI panel and the OTA check ride."

[[modules.device.group]]
files = ["moy_ota.py", "moy_ota_health.py"]
why = """
The OTA updater (#53). Board-agnostic: its update directory is a constructor
argument (run_desktop passes a path on the internal VFS: a card can be pulled
out, and the update directory holds the device's own image) and its board identity comes from the generated `_ota_build.py` --
`guition_p4`, a manifest of its own, since an app image is board-specific.
The updater itself is the kernel's (native/moy_net/moy_ota.c: the streaming
HTTP(S) client the updater and Get Carts fetch through, the signature, the
slot); moy_ota.py is its Settings face and the identity, moy_ota_health.py the
boot verdict and the rollback confirm the frame loop drives."""



[[modules.device.group]]
files = ["moy_webhost.py"]
why = """
STAGE 6. The web console's Settings contract over the kernel's webhost
(native/moy_net/moy_webhost.c: the listener, the baked bundle, the store's
pulls and the sync apply, polled with no Python), and the routes the console
answers: PLAY ON DEVICE and the firmware hand-off."""
