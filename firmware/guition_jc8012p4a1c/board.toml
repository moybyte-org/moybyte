#  Moybyte board definition -- Guition JC8012P4A1C (ESP32-P4 + C6, 10.1")
#  ====================================================================
#
#  The fifth build target and the second ESP32-P4 board (2026-09-06): a
#  VARIANT PORT of the Waveshare 7B -- same silicon class (P4 + C6 over SDIO
#  + a MIPI-DSI touch panel), so its board file is the Waveshare's with the
#  panel, the touch part and the flash size changed. What the two share as
#  DATA rather than as copies is the whole point of the port:
#  `[native.p4]` (the P4 silicon tier), `device/dsi_panel.py`,
#  `device/p4_canvas.py`, and the device allowlist below.
#
#  Read `README.md` in this directory before touching the board: it holds
#  what this glass decided (800x1280 is PORTRAIT-NATIVE and the console runs
#  portrait on it, the GSL3680 is RAM-loaded, the backlight is active-high)
#  and what carried over from the Waveshare unchanged (the C6 wiring, the SD
#  slot on LDO4, the VFS-shadowing rule).

[board]
name    = "guition_jc8012p4a1c"
chip    = "esp32p4"
ota     = "guition_p4"      # the board id inside a signed OTA manifest (#53)
tier    = "desktop"
tier_why = """
800x1280 (portrait-native glass, run portrait -- README), TWO canvases: a big
system canvas plus a real 320x240 game canvas composited into a window
(`blit_game`) on the PPA, exactly the Waveshare's arrangement one size up.
That is what makes `wm_windowed.py` and its `surface.py` leaf right here and
wrong on the S3 boards."""

[panel]
# The GLASS, in inches -- the opt-in to the chrome tap-target floor (#203):
# `chrome.chrome_scale_floor` turns it into the smallest scale that keeps a
# 16px bar icon at `chrome.MIN_TAP_MM`, and the shell lays out interactive
# geometry (the bar, the menu's rows, the Settings rows, the code editor's
# symbol keys) at that scale while every glyph stays on the font scale.
# Declared 2026-09-06 on the owner's verdict from the desk: the 1x layout the
# Waveshare 7" runs makes the buttons "too tiny" on a 10.1" that is touch-only
# -- 1280x800 on this diagonal is ~150 PPI, a 16px icon 2.7mm, so the floor
# lands at 2 with the font untouched (the same call the Guition S3 made, for
# the same reason: legibility was never the problem, tap size was).
# `modules/moy_runtime.py`'s PANEL_DIAGONAL_IN carries this number to the
# console; tests/test_board_toml.py pins the two together.
diagonal_in = 10.1

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# `modules/` mixes board-authored files (tracked; see .gitignore) with
# build-staged copies, and the frozen manifest freezes the whole DIRECTORY
# rather than the list the stager copied -- so a module that stops being
# staged keeps being frozen on every tree that has built before (the
# Waveshare's board.toml has the live proof). The stager PRUNES untracked
# strays it did not just stage, loudly, at the top of every build.
prune = true
keep  = [
  "carts_data.py",   # generated by tools/gen_device_carts.py from system_carts/
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY runtime/*.py; name the ones that must not cross, with the reason.

An allowlist asks "did somebody remember to add this?"; a denylist asks "is
there a reason this must not cross?". The first question's wrong answer is
silent, because every consumer in this tree is capability-gated.

`tests/test_staging_closure.py` derives this board's frozen set from THIS FILE
and asserts every import of every staged module resolves on this target."""

# -- host-only: real code, real purpose, impossible or wrong on a board ------
#
# Identical to the Waveshare's and the T-Deck's list. That is a property worth
# noticing rather than a duplication to factor out: boards agreeing about
# which HOST modules are host-only is a claim each board makes for itself, and
# `tests/test_staging_closure.py` cross-checks that they agree.

[[modules.shared.deny]]
file = "host_app.py"
kind = "host-only"
why  = """
The simulator's glue: a pygame window, the mouse/trackball ConsoleDriver, and
`build_workstation()`. It imports the host's world wholesale."""

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeAudio/FakeWifi + ConsoleDriver.
make_api itself is ONE body in the shared `cart_api.py` since 2026-08-17
(which DOES stage here; `device_api.py` re-exports it), so this denial is
about dead weight, not duplicate backends: nothing on a board constructs a
fake service or a sim driver."""

[[modules.shared.deny]]
file = "host_canvas.py"
kind = "host-only"
why  = """
Runs the BOARDS' canvas class on CPython. The board has the real one; this is
the adapter that exists only because CPython is not a board."""

[[modules.shared.deny]]
file = "gfx_binding.py"
kind = "host-only"
why  = """
`moy_gfx` for CPython: compiles `moyhost_gfx.c` and dlopens it via ctypes. Here
`moy_gfx` is a compiled-in usermod (native/.staged/moy_gfx)."""

[[modules.shared.deny]]
file = "lua_binding.py"
kind = "host-only"
why  = "ctypes over libmoy's Lua binding. This board compiles moy_lua + moycore in."

[[modules.shared.deny]]
file = "audio_binding.py"
kind = "host-only"
why  = """
ctypes over the vendored libmoy synth (#97). Audio on this board is an ES8311
+ ES7210 on the same I2C bus as the touch (the Waveshare's parts, PA enable
on GPIO20 here) and is unwired exactly as it is there (#82) -- and when it
lands it will be a usermod, not this."""

[[modules.shared.deny]]
file = "native_build.py"
kind = "host-only"
why  = """
The compile-and-cache helper the three bindings above share: subprocess to a C
compiler, hash-keyed .so cache. No compiler on a board."""

[[modules.shared.deny]]
file = "lua_host.py"
kind = "host-only"
why  = "The host's Lua cart runner. The device's is `moycore`, driven by moycore_glue.py."

[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`. The board's input contract is the frozen `moybyte`
package, staged whole below -- freezing both puts two classes of one name in
one image."""

# -- never on a board: importing it RAISES, which reads as a missing feature --

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
Builds MOY64's indices 16-63 with CPython's `colorsys` at IMPORT time;
MicroPython has none. Verified on the Waveshare's glass 2026-08-15 (its
board.toml has the story); the same MicroPython, the same answer here."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- the file no longer exists. `runtime/canvas.py` was the pure-Python
indexed raster, deleted 2026-08-15 when the host moved onto
`device_canvas.DeviceCanvas`. Kept named so its return is a decision."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
Browser event batches -> InputState/Pointer. It survived the 2026-08 streaming
sunset because the plan's §3.4 sync/controller RPC speaks the same format, but
that RPC is not built and today's only importer is the wasm head's web_boot.py.
This board SERVES the wasm console (moy_webhost) -- it does not decode its
input. Flip this the day it does."""

# NOTE the two files that are NOT denied here and ARE on the S3 boards:
# `wm_windowed.py` and its `surface.py` leaf. See [board].tier_why.

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62), staged under the name `device_canvas`
imports before it will use the native `moy_gfx.text` kernel -- so device text
rasterizes from the same bytes the host draws from."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py (#202 Phase A). The merged image flashes at
# 0x2000 (the P4's bootloader offset); otadata is at 0xd000 on this table
# (the Waveshare's layout, on 16MB instead of 32MB) and is erased first so a
# board that has taken an OTA boots the slot the cable flash just wrote.
# No `before`: this board flashes over the P4's OWN USB-Serial/JTAG (no
# external UART bridge), which esptool's default reset drives cleanly --
# measured 2026-09-06: chip_id, a 16MB read_flash and the first write_flash
# all connected first try with no BOOT button.
image          = "dist/guition_p4/moybyte_guition_p4.bin"
offset         = "0x2000"
baud           = 921600
otadata_offset = "0xd000"
otadata_size   = "0x2000"

[serial]
# Read by tools/push_cart.py. THE LINE STATE AT OPEN IS BOARD-SPECIFIC AND
# LOAD-BEARING. This is the P4's own USB-Serial/JTAG (303a:1001), the
# arrangement the two S3 boards have and the Waveshare P4 does NOT: opening
# with dtr/rts LOW is a chip reset, after which the USB device re-enumerates
# under the open handle and every read returns nothing forever. Attach with
# both ASSERTED -- pyserial's default, and what miniterm does.
dtr         = true
rts         = true
# ATTACH ONLY: never pulse the line to reset (P4Board.reset() is the CH343
# board's verb; here it strands the handle). The on-glass suite attaches to
# the running desktop and leaves the console where it found it.
attach_only = true
# The SoC's own USB-Serial/JTAG id, SHARED with the T-Deck, the Guition S3
# and the Zero -- it narrows the candidates and cannot finish the job; the
# harness settles ambiguity by asking each candidate for its `_ota_build.BOARD`
# (safe here: attach_only boards open without resetting).
usb         = "303a:1001"
# USB backpressures, so the S3 boards' chunk and window carry over: the
# USB-Serial/JTAG ISR only drains what the stdin ring has room for, so the
# endpoint stalls and the HOST blocks -- the window buys fewer round trips,
# it is not the safety margin it is on the Waveshare's unflow-controlled UART.
chunk       = 768
window      = 16384

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

[native]
dest = "native/.staged"

[native.shared]
source   = "native"
why = """
The C-module twin of [modules.shared] (#161; see the T-Deck's board.toml for
the mechanism). Every directory under native/ with a micropython.cmake crosses
unless denied here. The three denials are the Waveshare's three, for the same
hardware reasons. (native/p4/ has no micropython.cmake of its own, so this
scan never sees it -- that tier is the second source, [native.p4] below.)"""

[[native.shared.deny]]
module = "moy_sd"
why = """
This console has no SD card in play: carts live on the internal-flash VFS
(/moy/carts), OTA stages to /moy/update, and moy_sd's whole reason to exist --
attaching a card to a host the T-Deck's moy_lcd already initialised, on a
SHARED SPI bus -- names hardware this board does not have. The TF slot here
is the Waveshare's arrangement exactly (SDMMC slot 0 on GPIO39-44, powered
from LDO channel 4 -- the vendor BSP says so); when a removable-cart
workflow lands it will be an SDMMC driver, not this SPI-attach module."""

[[native.shared.deny]]
module = "moy_audio"
why = """
Audio on this board is the same OPEN ES8311 bring-up as the Waveshare's (#82;
same codec, same I2S pins, PA enable GPIO20 instead of 53). moy_audio's synth
half (vendored libmoy) is board-agnostic, but its I2S plumbing is written
against the T-Deck's wiring and nothing here would construct it --
device_audio.py is not in this board's device allowlist either. Flip both
together when #82 lands."""

[[native.shared.deny]]
module = "moy_flush"
why = """
There is no flush on this board to feed. moy_flush is the banded-flush engine
the two S3 boards share (core-0 feeder, two internal-SRAM bounce slots, the
kick/drain handoff) -- it exists because an SPI panel has to PUSH every frame.
The P4's panel is MIPI-DSI in DPI mode: the peripheral scans a PSRAM
framebuffer continuously, so there is no per-frame transfer, no band, no
bounce and no completion ISR. Staging it would compile a FreeRTOS task and a
DMA-SRAM allocation into the image for code nothing calls. A DSI board that
ever needs a push path is a new decision, not a flip of this one."""

[native.p4]
source   = "native/p4"
why = """
The ESP32-P4 SILICON tier: the C modules an ESP32-P4 board has BECAUSE it is a
P4 -- moy_dsi (the MIPI-DSI panel; THIS board names MOY_DSI_PANEL_JD9365 in
its mpconfigboard.cmake and the module drives the JD9365 at 800x1280),
moy_ppa (the pixel accelerator behind the game composite), moy_ble_hid (the
NimBLE-host report queue over the C6's hosted radio) and moy_c6 (the ESP-NOW
shim + C6 plumbing over ESP-Hosted -- the C6 wiring here is the Waveshare's
pin for pin: SDIO CLK18/CMD19/D0-3 14-17, reset 54). This board is the
SECOND consumer that moved the tier out of the Waveshare's tree (2026-09-06,
Phase C of docs/board_ports_2026-08.md). Nothing is denied."""

# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
why = """
The second staging source, and the one that must STAY an allowlist.

`runtime/` is a shared tree by definition, so a denylist over it is safe: the
default answer is "yes, this crosses". `device/` is the boards' shared DEVICE
tier -- a repo-root tree since the fork's deletion (2026-08-17, `a02bb33`).
It stays an allowlist even so, because not every board drives every piece of
it: this board has no SD and no I2S in play (`moybyte_sd.py`,
`device_audio.py` stay T-Deck-only), no GT911 (`gt911.py` crosses only for
its HeldPoint core, which the GSL3680 driver rides), and the allowlist is
where that per-board difference is written down rather than discovered as a
frozen module nothing imports.

Each file named below is board-AGNOSTIC by construction, with its
board-specific imports guarded and its hardware inputs passed as constructor
arguments.

The boot spine and frame pump are `runtime/device_boot.py` and reach this
board through the SHARED denylist above. The line that decides is whether a
module can import with no board present: device_boot takes every hardware
object as an argument, so it loads on CPython and its shared half is executed
by tests/test_device_boot.py."""
packages = ["moybyte"]
packages_why = """
`moybyte/` is directory-shaped: `moybyte.input` is the boards' real InputState
plus the T-Deck keyboard matrix. Staged WHOLE (minus __pycache__) rather than
file-by-file, so a new member of the package cannot go missing here.

(Declared HERE, above the groups: a bare key after a `[[modules.device.group]]`
header belongs to that group's table, not to `[modules.device]`.)"""

[[modules.device.group]]
files = ["boot_shell.py"]
why = """
The boot shell's mode ladder, which `modules/moybyte_shell.py` on this board is
now three declarations over: the board's name, the modes it has, and the module
its smokes live in. It was ~20 lines written once per board and byte-identical
after normalising those three, so the ONE-STRING rule, the self-terminating
smokes and the keep-the-REPL guards now land once instead of four times."""

[[modules.device.group]]
files = ["desktop_spine.py"]
why = """
The console desktop's boot spine: ONE `build_desktop` (the boot order and the
service set every console board wires) and ONE frame loop over it, with the
touch-only tier's frame hooks as defaults. The four boards' `run_desktop`s
carried the same imports, the same IdleBlank/FramePump/FrameLoop construction,
the same `ws.*` service assignments and the same hook names in fifty-four
byte-identical lines each; a board now passes its hardware -- compositor,
canvas, inputs, keyboard, store, constants -- and takes the rest."""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py", "device_api.py", "moycore_glue.py"]
why = """
The drawing backend and the cart namespace: DeviceCanvas (the raster every tier
now runs, RGB565 with the palette resolved at draw time), `device_api` (the
device home of THE make_api -- one body in the shared cart_api.py since
2026-08-17, re-exported here), moycore's host half (input snapshot in, audio
queue out, pmem at the #66 boundaries), and the leaf ticks helpers
device_canvas imports."""

[[modules.device.group]]
files = ["dsi_panel.py", "p4_canvas.py", "p4_desktop.py"]
why = """
The P4 silicon tier's Python half (2026-09-06, promoted out of the Waveshare's
p4_display.py / moy_runtime.py the day this board became their second
consumer): the DSI compositor over native/p4/moy_dsi (triple-buffer rotation,
deferred present, fences) and the SYSTEM canvas with the PPA composite hooks
the windowed WM probes for. This board's guition_p4_display.py adds only its
backlight; its moy_runtime.py constructs the canvas at this glass's size."""

[[modules.device.group]]
files = ["gt911.py", "gsl3680.py"]
why = """
The touch driver: `gsl3680.py` is the Silead GSL3680's shared core (a NEW
part, so it starts in device/ with the board's pins, firmware and flips
passed in -- the port checklist's stage-2 rule), and `gt911.py` crosses for
ONE thing, its HeldPoint -- the no-news contract every touch driver rides
(hold / stale-mark / bound). No GT911 is on this board. The firmware the
driver uploads is the board's own `gsl_fw_jc8012.py` (tracked, in modules/):
it carries this glass's sensor geometry and belongs to no other board."""

[[modules.device.group]]
files = ["ble_keyboard.py"]
why = """
The BLE HID keyboard (#26). Standard `bluetooth` API; this board's radio is
the companion C6 over ESP-Hosted SDIO, exactly the Waveshare's arrangement,
and the `moy_ble_hid` notification fast-path usermod is the P4 silicon tier's
(the driver imports it guardedly). UNVERIFIED on this board's glass: no
keyboard was paired at bring-up."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "The WLAN service the console's Settings WIFI panel and the OTA check ride."

[[modules.device.group]]
files = ["moy_espnow.py"]
why = """
The console's ONE ESP-NOW owner (#7/#65) -- the same file the two S3 boards
stage, UNCHANGED, which is the whole point of the moy_c6 shim underneath it:
this board's `espnow` module is MicroPython's stock modespnow.c linked against
seventeen esp_now_* wrappers that ride ESP-Hosted's custom RPC to the C6,
where the real radio is (native/p4/moy_c6 + the Waveshare's c6_slave/, the
plan and every on-glass verdict in docs/history/espnow_p4_2026-08.md).
Proven on the air on the WAVESHARE; on this board the C6 runs Guition's
factory slave, which has no shim, so make_link's start() fails into an
inactive link -- the soft-fail the module was designed for -- until the
shimmed slave is flashed to this C6 (README: open item). One board-specific
fact, already the module's own rule: the C6's radio starts with the host's
WLAN, so link.start()'s wlan.active(True) is load-bearing here."""

[[modules.device.group]]
files = ["moy_ota.py"]
why = """
The OTA updater (#53). Board-agnostic: its staging directory is a constructor
argument (this console has no SD, so run_desktop passes a path on the internal
VFS) and its board identity comes from the generated `_ota_build.py` --
`guition_p4`, a manifest of its own, since an app image is board-specific."""

[[modules.device.group]]
files = ["moy_c6_update.py"]
why = """
The C6 radio's own updater (#7/#58): Settings -> UPGRADE C6 RADIO downloads
the shimmed slave image a manifest's `c6` block names and streams it to the
co-processor over SDIO (moy_c6.ota_*). Staged for parity with the Waveshare
-- same C6, same SDIO, same shim -- but this board's manifest carries no `c6`
block yet (CI builds the slave image in the Waveshare's job only), so the row
has nothing to offer until the publisher stages one for `guition_p4`."""

[[modules.device.group]]
files = ["moy_webserver.py", "moy_webhost.py"]
why = """
The socket/HTTP transport core that survived the streaming sunset, plus the
"serve the wasm console from this board" handler (plan §3.4's pull half).
Board-agnostic -- the web directory and the SD gate are constructor arguments.
The WebSocket half went in 2026-09 with `web_view_ws.py`: the RPC that was
supposed to ride it shipped as plain HTTP, so both were frozen here with no
caller."""
