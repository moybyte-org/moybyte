#  Moybyte board definition -- Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
#  =================================================================
#
#  #161: a board's definition lives in six places in three languages, and the
#  first field to move here is the one that had already produced a bug -- the
#  STAGED MODULE LIST. Read `tools/board_config.py` for the mechanism; the
#  prose lives WITH the declaration on purpose (#161: "whatever moves, the
#  prose rationale moves with it").
#
#  Read `README.md` in this directory before touching the board at all: it
#  holds the hardware-learned constraints (LDO4 powers the SD, SDMMC slot 1
#  belongs to the C6, PSRAM must run at 200MHz or DSI scan-out underruns, a
#  root-level VFS dir named like a frozen module SHADOWS it). Those have NOT
#  moved here -- sdkconfig knobs, the partition table and the patch ladder are
#  still imperative in `build.sh`, which #161 ranks below this field.

[board]
name    = "esp32_p4_wifi6_touch_lcd_7b"
chip    = "esp32p4"
ota     = "p4"              # the board id inside a signed OTA manifest (#53)
tier    = "desktop"
tier_why = """
1024x600, TWO canvases: a big system canvas plus a real 320x240 game canvas
composited into a window (`blit_game`). That is what makes `wm_windowed.py` and
its halves right here and wrong on the S3 -- the two boards' shared
module lists differ by exactly those files, and by nothing else."""

# ---------------------------------------------------------------------------

[panel]
# The GLASS, in inches -- the opt-in to the chrome tap-target floor (#203).
# 1024x600 on 7.0" is ~170 PPI, so a 16px bar icon is 2.4mm and the floor
# (`chrome.MIN_TAP_MM`, 4.5) answers chrome scale 2.
#
# The #203 note said declaring here was "only free while that board runs at
# font scale 2", and this board runs at 1 (`FONT_SCALE`, owner call 2026-07-12:
# the 7" panel fits CONTENT, not magnification) -- so it is NOT free, and the
# owner made the call on 2026-09-06 anyway. It costs nothing but pixels here:
# 1024px of width absorbs a 36px bar without dropping a single tab chip or a
# Settings row, and the code editor's symbol keys -- this board's on-screen
# keyboard until a BLE one is paired -- double. The T-Deck was declined on the
# same day for the opposite arithmetic; its board.toml records why.
diagonal_in = 7.0

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# `modules/` mixes P4-authored files (tracked; see .gitignore) with build-staged
# copies, and the frozen manifest freezes the whole DIRECTORY rather than the
# list build.sh copied. So a module that stops being staged keeps being frozen
# on every tree that has built before. Live proof at the time this file was
# written: `canvas.py`, `palette.py` and `moy_lua_glue.py` were all still
# sitting here -- and therefore still in the image -- long after the last build
# that produced them. The stager PRUNES untracked strays it did not just stage,
# loudly, at the top of every build.
prune = true
keep  = [
  "carts_data.py",   # generated by tools/gen_device_carts.py from system_carts/
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY runtime/*.py; name the ones that must not cross, with the reason.

This board's build.sh used to carry a hand-written `for f in ...` list, which
`docs/backend_contract_v1.md` §8 described as a denylist -- it never was one.
An allowlist asks "did somebody remember to add this?"; a denylist asks "is
there a reason this must not cross?". The first question's wrong answer is
silent, because every consumer in this tree is capability-gated.

`tests/test_staging_closure.py` derives this board's frozen set from THIS FILE
and asserts every import of every staged module resolves on this target."""

# -- host-only: real code, real purpose, impossible or wrong on a board ------
#
# Identical to the T-Deck's list. That is a property worth noticing rather than
# a duplication to factor out: two boards agreeing about which HOST modules are
# host-only is a claim each board makes for itself, and
# `tests/test_staging_closure.py` cross-checks that they agree.

[[modules.shared.deny]]
file = "host_app.py"
kind = "host-only"
why  = """
The simulator's glue: a pygame window, the mouse/trackball ConsoleDriver, and
`build_workstation()`. It imports the host's world wholesale."""

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeWifi + ConsoleDriver.
make_api itself is ONE body in the shared `cart_api.py` since 2026-08-17
(which DOES stage here; `device_api.py` re-exports it), so this denial is
about dead weight, not duplicate backends: nothing on a board constructs a
fake service or a sim driver."""

[[modules.shared.deny]]
file = "host_canvas.py"
kind = "host-only"
why  = """
Runs the BOARDS' canvas class on CPython. The board has the real one; this is
the adapter that exists only because CPython is not a board."""

[[modules.shared.deny]]
file = "net_binding.py"
kind = "host-only"
why  = """
`moy_net` for CPython: compiles native/moy_net and dlopens it through ctypes.
Here `moy_net` is a compiled-in usermod (native/.staged/moy_net)."""

[[modules.shared.deny]]
file = "glass_binding.py"
kind = "host-only"
why  = """
`moy_glass` for CPython: compiles native/moy_glass and dlopens it through
ctypes. Here `moy_glass` is a compiled-in usermod (native/.staged/moy_glass)."""

[[modules.shared.deny]]
file = "gfx_binding.py"
kind = "host-only"
why  = """
`moy_gfx` for CPython: compiles `moyhost_gfx.c` and dlopens it via ctypes. Here
`moy_gfx` is a compiled-in usermod (native/.staged/moy_gfx)."""

[[modules.shared.deny]]
file = "lua_binding.py"
kind = "host-only"
why  = "ctypes over libmoy's Lua binding. This board compiles moy_lua + moycore in."

[[modules.shared.deny]]
file = "audio_binding.py"
kind = "host-only"
why  = """
`moy_audio` for CPython: ctypes over native/moy_audio and the vendored libmoy
synth. Here `moy_audio` is the usermod, the kernel's audio, which drives the
ES8311 (#82)."""

[[modules.shared.deny]]
file = "native_build.py"
kind = "host-only"
why  = """
The compile-and-cache helper the three bindings above share: subprocess to a C
compiler, hash-keyed .so cache. No compiler on a board."""

[[modules.shared.deny]]
file = "lua_host.py"
kind = "host-only"
why  = "The host's Lua cart runner. The device's is `moycore`, driven by moycore_glue.py."


[[modules.shared.deny]]
file = "wasm_host.py"
kind = "host-only"
why  = """
The host's compiled-cart runner, over `wasm_binding`. The device's is moycore's wasm half, driven by moycore_glue.py over the moy_wasm engine."""

[[modules.shared.deny]]
file = "wasm_binding.py"
kind = "host-only"
why  = """
ctypes over libmoy's wasm import table and WAMR built for Linux, fetched and
compiled on demand -- no compiler, git or cmake on a board."""
[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`. The board's input contract is the frozen `moybyte`
package, staged whole below -- freezing both puts two classes of one name in
one image."""

# -- never on a board: importing it RAISES, which reads as a missing feature --

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
Builds MOY64's indices 16-63 with CPython's `colorsys` at IMPORT time;
MicroPython has none. VERIFIED ON THIS BOARD'S GLASS 2026-08-15, on firmware
built before it was unstaged: `import colorsys`, `import palette` and `import
canvas` all raise ImportError, and the visible consequence was one level up --
the Appearance screen's cart-wallpaper panel drew its black fill and nothing
else, because `wallpaper._ensure_preview()` was returning False every time. A
module that raises on import is worse than one that is missing: every caller
here is guarded, so it reads as a feature that quietly does not exist."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- the file no longer exists. `runtime/canvas.py` was the pure-Python
indexed raster, deleted 2026-08-15 when the host moved onto
`device_canvas.DeviceCanvas`. Kept named so its return is a decision."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
Browser event batches -> InputState/Pointer. It survived the 2026-08 streaming
sunset because the plan's §3.4 sync/controller RPC speaks the same format, but
that RPC is not built and today's only importer is the wasm head's web_boot.py.
This board SERVES the wasm console (moy_webhost) -- it does not decode its
input. Flip this the day it does."""

# NOTE the two files that are NOT denied here and ARE on the T-Deck:
# `wm_windowed.py` and its halves. See [board].tier_why.

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62), staged under the name `device_canvas`
imports before it will use the native `moy_gfx.text` kernel -- so device text
rasterizes from the same bytes the host draws from."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py (Phase A of the board-port kit, #202). The
# merged image flashes at 0x2000 (the P4's bootloader offset); otadata is at
# 0xd000 on THIS table (NOT the T-Deck's 0x1d000) and is erased first so a
# board that has taken an OTA boots the slot the cable flash just wrote.
# No `before`: the CH343 is an external USB-UART and esptool's default reset
# is reliable on it.
image          = "dist/p4/moybyte_p4.bin"
offset         = "0x2000"
baud           = 921600
otadata_offset = "0xd000"
otadata_size   = "0x2000"

[serial]
# Read by tools/push_cart.py. THE LINE STATE AT OPEN IS BOARD-SPECIFIC AND
# LOAD-BEARING -- the same facts tests/test_p4_on_glass.py and
# tests/test_tdeck_on_glass.py encode by hand, as data instead.
#
# The CH343 is an EXTERNAL USB-UART with the esptool auto-reset circuit on
# DTR/RTS. The REST state is both LOW, so a reset is explicit (an RTS pulse)
# -- but the ORDER of getting there matters: the kernel raises both lines when
# the tty opens and pyserial lowers DTR before RTS, and RTS-high-DTR-low IS the
# EN pulse. Every tool attach power-cycled this board until 2026-09-02;
# P4Board opens with DTR raised, lets RTS drop, then lowers DTR.
dtr         = false
rts         = false
attach_only = false
# The USB device identity, for resolving WHICH /dev/tty* is this board without
# trusting a remembered port number -- ttyACM numbering shuffles whenever a
# board resets or replugs, and on 2026-08-24 a whole measurement session ran
# against the T-Deck believing it was this board (caught only by the boot log
# growing an SD card and a trackball). The CH343 is the only external USB-UART
# on this desk, so the id alone resolves it; the definitive check is still the
# board's own `_ota_build.BOARD` answer, which the harness verifies after
# attach/reset.
usb         = "1a86:55d3"
# THIS BOARD'S SERIAL IS A UART WITH NO FLOW CONTROL: a byte that arrives with
# the stdin ring full is dropped with no error, and only a hash or a parse
# notices. The ring is 4 KB (tools/patch_stdin_ring.py, sized 2026-09-30): a
# heap collection stalls the reader for up to ~95 ms, 1.1 KB at line rate, and
# the harness's longest line fits it whole. On the stock 260 bytes the two
# numbers below were the smallest that held (768 corrupted a push five times
# running, 2026-08-19; windows of 2048 and 4096 never completed one).
#
# The `py`-line chunk, how much of a snippet one `pyexec` line carries. Its
# %r escaping can nearly double it and the line still fits the ring. 1024,
# measured 2026-09-30: a 255 KB cart pushed 4/4 with its helpers installed at
# 1024, and 70 lines of 256-2560 characters, each in one write, went 70/70
# with a collection forced every 200 ms.
chunk       = 1024
# The RAW window (`recv`, the dev channel's 8-bit upload path): how many bytes
# the host may put on the wire before it must wait for the board's ack. The ack
# is this board's only backpressure, and a window smaller than the ring lands
# whole even if the board reads none of it until the last byte is in, so no
# stall inside a window can drop a byte -- the board acks before its file
# write, so the stall a window most often meets is that write. 3072 is three
# quarters of the ring. Measured 2026-09-30 with the same cart: 4/4 at 2048 and
# 8/8 at 3072, two of those with a collection forced every 200 ms and three
# with the diag stream on, no window re-sent.
window      = 3072
# The UART rate a `recv` payload crosses at (`recv rate=`, tools/push_cart.py):
# the console stays at 115200 for every line -- `moy push`, a terminal and the
# boot log expect it -- and switches for a file bigger than one window, between
# two syncs. Picked 2026-10-01 from 1.5, 2, 3 and 4 Mbaud, 256 KB pushes each:
# every rate landed byte-exact on an idle desk, and under Jet Teapot with a
# collection forced every 200 ms 2 Mbaud went 8/8 with no window re-sent where
# 3 Mbaud lost one sync in 8. Past ~1 Mbaud the rate is not the limit; the
# flash store's write is, so the margin is worth more than the 5% 3 Mbaud buys.
recv_baud   = 2000000

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

[native]
dest = "native/.staged"

[native.impl]
spine = "c"
why = """
The kernel's spine (docs/kernel_spine_2026-10.md) is native on this console: its
handle tables, app registry, back-stack, WiFi leases and settings rows are
native/moy_spine, and runtime/moy_spine.py, its Python twin, is not frozen into
the image (`import moy_spine` reaches the extensible builtin). tools/
esp32_build_lib.sh exports each value here as MOY_<NAME>_IMPL unless the build's
environment sets one: MOY_SPINE_IMPL=py builds the twin in again, which is how
`tools/moy_index_spike.py sizes` measures the difference. Every console takes
it; the Zero declares none, because it has no console to route."""

[native.shared]
source   = "native"
why = """
The C-module twin of [modules.shared] (#161; see the T-Deck's board.toml for
the mechanism). Every directory under native/ with a micropython.cmake crosses
unless denied here. The denial below is what the old hand-written cp list in
build.sh silently encoded; now it is a decision with a reason someone can
check. (native/p4/ has no micropython.cmake of its own, so this scan never
sees it -- that tier is the second source, [native.p4] below.)"""

[[native.shared.deny]]
module = "moy_flush"
why = """
There is no flush on this board to feed. moy_flush is the banded-flush engine
the two S3 boards share (core-0 feeder, two internal-SRAM bounce slots, the
kick/drain handoff) -- it exists because an SPI panel has to PUSH every frame.
The P4's panel is MIPI-DSI in DPI mode: the peripheral scans a PSRAM
framebuffer continuously, so there is no per-frame transfer, no band, no
bounce and no completion ISR. Staging it would compile a FreeRTOS task and a
DMA-SRAM allocation into the image for code nothing calls. A DSI board that
ever needs a push path is a new decision, not a flip of this one."""

[[native.shared.take]]
module = "moy_sd"
why = """
The card driver under the store's own card volume (docs/kernel_store_2026-10.md
slice 8): `moy_sd.mmc` brings the TF card up on SDMMC slot 0 (GPIO39-44, LDO4
powered; slot 1 is the C6's) once and never tears it down, and
native/moy_store's card -- the kernel's FATFS and read cache -- reads it
through `moy_sd_card_io`, with each transfer's bounce in PSRAM, which this
host's DMA reaches. `device/p4_desktop.p4_card` builds it and
`device/card_store.py` makes it the cart store when a card is in. The OTA
directory stays /moy/update on the internal VFS either way."""

[[native.shared.take]]
module = "moy_wasm"
why = """
The WebAssembly cart tier's engine (docs/wasm_tier_plan_2026-09.md): the
vendored WAMR runtime, AOT only, and the thread a module runs on. The tier
ships on every console board or on none, so this board takes it. Its internal
SRAM is not the constraint the S3 boards' is; the on-glass suite runs the same
wasm checks. The run stack's size and placement are this board's MOY_WASM_*
settings in mpconfigboard.h, with the measurement that chose them."""

[[native.shared.take]]
module = "moy_kernel"
why = """
The kernel's entry, crash record and recovery floor
(docs/kernel_spine_2026-10.md §6-§8): taking it is what makes the kernel own
app_main. Every console takes it; what is this board's is in mpconfigboard.h --
the panel module's four entry points the floor draws through, and the BOOT
button as the floor's input beside serial."""

[[native.shared.take]]
module = "moy_glass"
why = """
The glass's native home (docs/kernel_survival_2026-10.md section 3): canvas
rows, the buffer table, the pool and present. It compiles to nothing until pass
1 of sprint 3 gives it its sources; it is taken now so that pass changes no
build list. Every console takes it."""

[[native.shared.take]]
module = "moy_input"
why = """
Input's native home (docs/kernel_survival_2026-10.md section 4): the merged
table, its sources and the drivers below them. It compiles to nothing until
pass 2 of sprint 3 gives it its sources; every console takes it."""

[[native.shared.take]]
module = "moy_net"
why = """
The links' native home (docs/kernel_survival_2026-10.md section 6): WiFi, the
link, the HTTP core, the webhost, the sync RPC and the updater. It compiles to
nothing until pass 2 of sprint 3 gives it its sources; every board with a radio
takes it."""


[native.p4]
source   = "native/p4"
why = """
The ESP32-P4 SILICON tier: the C modules an ESP32-P4 board has BECAUSE it is a
P4 and no S3 board could compile -- moy_dsi (the MIPI-DSI panel, parameterized
by the board's panel define in mpconfigboard.cmake), moy_ppa (the pixel
accelerator behind the game composite), moy_ble_hid (the NimBLE-host report
queue over the C6's hosted radio) and moy_c6 (the ESP-NOW shim + C6 plumbing
over ESP-Hosted). All four lived in THIS board's tree until 2026-09-06, when
the Guition JC8012P4A1C became their second consumer -- Phase C's rule
(docs/board_ports_2026-08.md): a driver moves to a shared tree the day a
second board carries the hardware, parameterized by board data, not before.
Declared as a second SOURCE rather than as four denials on every S3 board:
a board that names this tier has the silicon; one that does not has nothing
to explain. Nothing is denied here -- every module in the tier is the
silicon's, not a panel's, except moy_dsi, which each P4 board parameterizes
(MOY_DSI_PANEL_*) rather than denies."""

# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
why = """
The second staging source, and the one that must STAY an allowlist.

`runtime/` is a shared tree by definition, so a denylist over it is safe: the
default answer is "yes, this crosses". `device/` is the boards' shared DEVICE
tier -- a repo-root tree since the fork's deletion (2026-08-17, `a02bb33`),
which is the move an earlier revision of this section called "the right end
state" and #161's Phase 4/5 had promised. It stays an allowlist even so,
because not every board drives every piece of it: this board has no SPI-shared
SD (`moybyte_sd.py` stays T-Deck-only), the T-Deck
has no BLE, and the allowlist is where that per-board difference is written down
rather than discovered as a frozen module nothing imports.

Each file named below is board-AGNOSTIC by construction, with its
board-specific imports guarded and its hardware inputs passed as constructor
arguments.

PHASE 4/5 UPDATE (2026-08-15): the boot spine and frame pump did NOT move here
-- they are `runtime/device_boot.py` and `runtime/frame_loop.py` and reach this
board through the SHARED denylist above, which is why nothing was added to this
section for them. The line that decides is whether a module can import with no
board present: both take every hardware object as an argument, so they load on
CPython and tests/test_device_boot.py executes their shared half."""
packages = ["moybyte"]
packages_why = """
`moybyte/` is directory-shaped: `moybyte.input` is the boards' real InputState
plus the T-Deck keyboard matrix. Staged WHOLE (minus __pycache__) rather than
file-by-file, so a new member of the package cannot go missing here.

(Declared HERE, above the groups, and not at the end of the section: a bare key
after a `[[modules.device.group]]` header belongs to that group's table, not to
`[modules.device]` -- which is exactly what the first draft of this file got
wrong and the stager reported as "no packages staged".)"""

[[modules.device.group]]
files = ["boot_shell.py"]
why = """
The boot shell's mode ladder, which `modules/moybyte_shell.py` on this board is
now three declarations over: the board's name, the modes it has, and the module
its smokes live in. It was ~20 lines written once per board and byte-identical
after normalising those three, so the ONE-STRING rule, the self-terminating
smokes and the keep-the-REPL guards now land once instead of four times."""

[[modules.device.group]]
files = ["desktop_spine.py", "wire_input.py", "wire_links.py"]
why = """
The console desktop's boot spine: ONE `build_desktop` (the boot order and the
service set every console board wires) and ONE frame loop over it, with the
touch-only tier's frame hooks as defaults. The four boards' `run_desktop`s
carried the same imports, the same IdleBlank/FramePump/FrameLoop construction,
the same `ws.*` service assignments and the same hook names in fifty-four
byte-identical lines each; a board now passes its hardware -- compositor,
canvas, inputs, keyboard, store, constants -- and takes the rest.

The spine constructs each subsystem through its provider: wire_input.py (the
pointer, the keyboards' start, a BLE-keyboard input state) and wire_links.py
(the radio link, the updaters, Get Carts' network, the web console). Audio has
no provider: the kernel's moy_audio needs no construction at boot."""

[[modules.device.group]]
files = ["mem_census.py"]
why = """
The memory census the spine marks its boot steps into: inert unless the flash
root holds `/mem_census` (written by `tools/mem_census.py`), which arms the
boot trace and the import timer. The spine imports it, so every board that
takes the spine takes it."""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py", "device_api.py", "moycore_glue.py",
         "gt911.py"]
why = """
The drawing backend and the cart namespace: DeviceCanvas (the raster every tier
now runs, RGB565 with the palette resolved at draw time), `device_api` (the
device home of THE make_api -- one body in the shared cart_api.py since
2026-08-17, re-exported here), moycore's host half (input snapshot in, audio
queue out, pmem at the #66 boundaries), and the leaf ticks helpers
device_canvas imports."""

[[modules.device.group]]
files = ["p4_canvas.py", "p4_desktop.py", "card_store.py"]
why = """
The P4 silicon tier's Python half (2026-09-06, promoted out of THIS board's
moy_runtime.py the day the Guition P4 became its second consumer): the
SYSTEM canvas with the PPA composite hooks the windowed WM probes for, and the
desk's boot. This board's compositor is the kernel's moy_glass.DsiCompositor
(native/moy_glass), constructed by its moy_runtime.py. `card_store.py` is the
cart store on a card
that has a bus of its own (tests/test_card_store.py executes it): the TF card
when one mounts, the internal flash when not."""

[[modules.device.group]]
files = ["ble_keyboard.py"]
why = """
The BLE HID keyboard (#26) -- born in this board's tree as p4_ble_keyboard.py,
promoted to device/ on 2026-08-19 when the Guition S3 became its second
consumer. Standard `bluetooth` API; this board's radio is the companion C6
over ESP-Hosted SDIO, and its `moy_ble_hid` notification fast-path usermod
stays board-local (the driver imports it guardedly)."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "The WLAN service the console's Settings WIFI panel and the OTA check ride."

[[modules.device.group]]
files = ["moy_espnow.py"]
why = """
The console's ONE ESP-NOW owner (#7/#65) -- the same file the two S3 boards
stage, UNCHANGED, which is the whole point of the moy_c6 shim underneath it:
this board's `espnow` module is MicroPython's stock modespnow.c linked against
seventeen esp_now_* wrappers that ride ESP-Hosted's custom RPC to the C6,
where the real radio is (native/moy_c6 + c6_slave/, the plan and every
on-glass verdict in docs/history/espnow_p4_2026-08.md). Proven on the air
2026-08-24 before this staging: the P4 receives the T-Deck's live beacons and
the T-Deck counts the P4's broadcasts. One board-specific fact, already the
module's own rule: the C6's radio starts with the host's WLAN, so
link.start()'s wlan.active(True) is load-bearing here, not ceremony."""

[[modules.device.group]]
files = ["moy_ota.py", "moy_ota_health.py", "moy_http.py"]
why = """
The OTA updater (#53). Board-agnostic: its update directory is a constructor
argument (run_desktop passes a path on the internal VFS: a card can be pulled
out, and the update directory holds the device's own image) and its board identity comes from the generated `_ota_build.py`. Verified
end to end on this board's glass 2026-08-02.
The updater's two halves are their own files: moy_ota_health.py, the boot
verdict and the rollback confirm the frame loop drives, and moy_http.py, the
streaming HTTP(S) client the updater and Get Carts fetch through."""

[[modules.device.group]]
files = ["cart_net.py"]
why = """
Get Carts' network (#124): the app's transport for indexes and carts, over
moy_http's client and moy_ota's wait for the link."""

[[modules.device.group]]
files = ["moy_c6_update.py"]
why = """
The C6 radio's own updater (#7/#58): Settings -> UPGRADE C6 RADIO downloads
the shimmed slave image the P4 manifest's `c6` block names and streams it to
the co-processor over SDIO (moy_c6.ota_*). Only this board has a C6, so only
this board stages it; the Settings row rides `ws.c6_updater is not None` and
every other board's rows stay frozen."""

[[modules.device.group]]
files = ["moy_webserver.py", "moy_webhost.py"]
why = """
The socket/HTTP transport core that survived the streaming sunset, plus the
"serve the wasm console from this board" handler (plan §3.4's pull half).
Board-agnostic -- the web directory and the SD gate are constructor arguments.
The WebSocket half went in 2026-09 with `web_view_ws.py`: the RPC that was
supposed to ride it shipped as plain HTTP, so both were frozen here with no
caller."""
