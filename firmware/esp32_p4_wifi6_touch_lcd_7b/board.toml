#  Moybyte board definition -- Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
#  =================================================================
#
#  #161: a board's definition lives in six places in three languages, and the
#  first field to move here is the one that had already produced a bug -- the
#  STAGED MODULE LIST. Read `tools/board_config.py` for the mechanism; the
#  prose lives WITH the declaration on purpose (#161: "whatever moves, the
#  prose rationale moves with it").
#
#  Read `README.md` in this directory before touching the board at all: it
#  holds the hardware-learned constraints (LDO4 powers the SD, SDMMC slot 1
#  belongs to the C6, PSRAM must run at 200MHz or DSI scan-out underruns, a
#  root-level VFS dir named like a frozen module SHADOWS it). Those have NOT
#  moved here -- sdkconfig knobs, the partition table and the patch ladder are
#  still imperative in `build.sh`, which #161 ranks below this field.

[board]
name    = "esp32_p4_wifi6_touch_lcd_7b"
chip    = "esp32p4"
ota     = "p4"              # the board id inside a signed OTA manifest (#53)
tier    = "desktop"
tier_why = """
1024x600, TWO canvases: a big system canvas plus a real 320x240 game canvas
composited into a window (`blit_game`). That is what makes `wm_windowed.py` and
its `surface.py` leaf right here and wrong on the S3 -- the two boards' shared
module lists differ by exactly those two files, and by nothing else."""

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# `modules/` mixes P4-authored files (tracked; see .gitignore) with build-staged
# copies, and the frozen manifest freezes the whole DIRECTORY rather than the
# list build.sh copied. So a module that stops being staged keeps being frozen
# on every tree that has built before. Live proof at the time this file was
# written: `canvas.py`, `palette.py` and `moy_lua_glue.py` were all still
# sitting here -- and therefore still in the image -- long after the last build
# that produced them. The stager PRUNES untracked strays it did not just stage,
# loudly, at the top of every build.
prune = true
keep  = [
  "carts_data.py",   # generated by tools/gen_device_carts.py from system_carts/
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY runtime/*.py; name the ones that must not cross, with the reason.

This board's build.sh used to carry a hand-written `for f in ...` list, which
`docs/backend_contract_v1.md` §8 described as a denylist -- it never was one.
An allowlist asks "did somebody remember to add this?"; a denylist asks "is
there a reason this must not cross?". The first question's wrong answer is
silent, because every consumer in this tree is capability-gated.

`tests/test_staging_closure.py` derives this board's frozen set from THIS FILE
and asserts every import of every staged module resolves on this target."""

# -- host-only: real code, real purpose, impossible or wrong on a board ------
#
# Identical to the T-Deck's list. That is a property worth noticing rather than
# a duplication to factor out: two boards agreeing about which HOST modules are
# host-only is a claim each board makes for itself, and
# `tests/test_staging_closure.py` cross-checks that they agree.

[[modules.shared.deny]]
file = "host_app.py"
kind = "host-only"
why  = """
The simulator's glue: a pygame window, the mouse/trackball ConsoleDriver, and
`build_workstation()`. It imports the host's world wholesale."""

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeAudio/FakeWifi + ConsoleDriver.
make_api itself is ONE body in the shared `cart_api.py` since 2026-08-17
(which DOES stage here; `device_api.py` re-exports it), so this denial is
about dead weight, not duplicate backends: nothing on a board constructs a
fake service or a sim driver."""

[[modules.shared.deny]]
file = "host_canvas.py"
kind = "host-only"
why  = """
Runs the BOARDS' canvas class on CPython. The board has the real one; this is
the adapter that exists only because CPython is not a board."""

[[modules.shared.deny]]
file = "gfx_binding.py"
kind = "host-only"
why  = """
`moy_gfx` for CPython: compiles `moyhost_gfx.c` and dlopens it via ctypes. Here
`moy_gfx` is a compiled-in usermod (native/.staged/moy_gfx)."""

[[modules.shared.deny]]
file = "lua_binding.py"
kind = "host-only"
why  = "ctypes over libmoy's Lua binding. This board compiles moy_lua + moycore in."

[[modules.shared.deny]]
file = "audio_binding.py"
kind = "host-only"
why  = """
ctypes over the vendored libmoy synth (#97). Audio on this board is the open
ES8311 bring-up (#82) -- and when it lands it will be a usermod, not this."""

[[modules.shared.deny]]
file = "native_build.py"
kind = "host-only"
why  = """
The compile-and-cache helper the three bindings above share: subprocess to a C
compiler, hash-keyed .so cache. No compiler on a board."""

[[modules.shared.deny]]
file = "lua_host.py"
kind = "host-only"
why  = "The host's Lua cart runner. The device's is `moycore`, driven by moycore_glue.py."

[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`. The board's input contract is the frozen `moybyte`
package, staged whole below -- freezing both puts two classes of one name in
one image."""

# -- never on a board: importing it RAISES, which reads as a missing feature --

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
Builds MOY64's indices 16-63 with CPython's `colorsys` at IMPORT time;
MicroPython has none. VERIFIED ON THIS BOARD'S GLASS 2026-08-15, on firmware
built before it was unstaged: `import colorsys`, `import palette` and `import
canvas` all raise ImportError, and the visible consequence was one level up --
the Appearance screen's cart-wallpaper panel drew its black fill and nothing
else, because `wallpaper._ensure_preview()` was returning False every time. A
module that raises on import is worse than one that is missing: every caller
here is guarded, so it reads as a feature that quietly does not exist."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- the file no longer exists. `runtime/canvas.py` was the pure-Python
indexed raster, deleted 2026-08-15 when the host moved onto
`device_canvas.DeviceCanvas`. Kept named so its return is a decision."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
Browser event batches -> InputState/Pointer. It survived the 2026-08 streaming
sunset because the plan's §3.4 sync/controller RPC speaks the same format, but
that RPC is not built and today's only importer is the wasm head's web_boot.py.
This board SERVES the wasm console (moy_webhost) -- it does not decode its
input. Flip this the day it does. (`web_view_ws.py` is the opposite case and IS
staged: `moy_webserver.py` imports it through a two-branch ladder with no third
branch, and dropping it once already made the WEB CONSOLE row silently not
exist -- 06506ab, then a0a9d21 three days later.)"""

# NOTE the two files that are NOT denied here and ARE on the T-Deck:
# `wm_windowed.py` and its `surface.py` leaf. See [board].tier_why.

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62), staged under the name `device_canvas`
imports before it will use the native `moy_gfx.text` kernel -- so device text
rasterizes from the same bytes the host draws from."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py (Phase A of the board-port kit, #202). The
# merged image flashes at 0x2000 (the P4's bootloader offset); otadata is at
# 0xd000 on THIS table (NOT the T-Deck's 0x1d000) and is erased first so a
# board that has taken an OTA boots the slot the cable flash just wrote.
# No `before`: the CH343 is an external USB-UART and esptool's default reset
# is reliable on it.
image          = "dist/p4/moybyte_p4.bin"
offset         = "0x2000"
baud           = 921600
otadata_offset = "0xd000"
otadata_size   = "0x2000"

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

[native]
dest = "native/.staged"

[native.shared]
source   = "native"
strategy = "denylist"
why = """
The C-module twin of [modules.shared] (#161; see the T-Deck's board.toml for
the mechanism). Every directory under native/ with a micropython.cmake crosses
unless denied here -- this board's own moy_dsi/moy_ppa/moy_ble_hid live in its
board tree and are not staged. The two denials below are what the old
hand-written cp list in build.sh silently encoded; now they are decisions with
reasons someone can check."""

[[native.shared.deny]]
module = "moy_sd"
why = """
This console has no SD card in play: carts live on the internal-flash VFS
(/moy/carts), OTA stages to /moy/update, and moy_sd's whole reason to exist --
attaching a card to a host the T-Deck's moy_lcd already initialised, on a
SHARED SPI bus -- names hardware this board does not have. The board README's
SD notes (LDO4 power, SDMMC slot 1 belongs to the C6) are about a FUTURE
removable-cart workflow; when that lands it will be an SDMMC driver, not this
SPI-attach module."""

[[native.shared.deny]]
module = "moy_audio"
why = """
Audio on this board is the OPEN ES8311 bring-up (#82). moy_audio's synth half
(vendored libmoy) is board-agnostic, but its I2S plumbing is written against
the T-Deck's wiring and nothing here would construct it -- device_audio.py is
not in this board's device allowlist either. Flip both together when #82
lands."""

# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
strategy = "allowlist"
why = """
The second staging source, and the one that must STAY an allowlist.

`runtime/` is a shared tree by definition, so a denylist over it is safe: the
default answer is "yes, this crosses". `device/` is the boards' shared DEVICE
tier -- a repo-root tree since the fork's deletion (2026-08-17, `a02bb33`),
which is the move an earlier revision of this section called "the right end
state" and #161's Phase 4/5 had promised. It stays an allowlist even so,
because not every board drives every piece of it: this board has no SD and no
I2S (`moybyte_sd.py`, `device_audio.py` stay T-Deck-only), the T-Deck has no
BLE, and the allowlist is where that per-board difference is written down
rather than discovered as a frozen module nothing imports.

Each file named below is board-AGNOSTIC by construction, with its
board-specific imports guarded and its hardware inputs passed as constructor
arguments.

PHASE 4/5 UPDATE (2026-08-15): the boot spine and frame pump did NOT move here
-- they went into `runtime/device_boot.py` and reach this board through the
SHARED denylist above, which is why nothing was added to this section for them.
The line that decides is whether a module can import with no board present:
device_boot takes every hardware object as an argument, so it loads on CPython
and its shared half is executed by tests/test_device_boot.py."""
packages = ["moybyte"]
packages_why = """
`moybyte/` is directory-shaped: `moybyte.input` is the boards' real InputState
plus the T-Deck keyboard matrix. Staged WHOLE (minus __pycache__) rather than
file-by-file, so a new member of the package cannot go missing here.

(Declared HERE, above the groups, and not at the end of the section: a bare key
after a `[[modules.device.group]]` header belongs to that group's table, not to
`[modules.device]` -- which is exactly what the first draft of this file got
wrong and the stager reported as "no packages staged".)"""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py", "device_api.py", "moycore_glue.py"]
why = """
The drawing backend and the cart namespace: DeviceCanvas (the raster every tier
now runs, RGB565 with the palette resolved at draw time), `device_api` (the
device home of THE make_api -- one body in the shared cart_api.py since
2026-08-17, re-exported here), moycore's host half (input snapshot in, audio
queue out, pmem at the #66 boundaries), and the leaf ticks helpers
device_canvas imports."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "The WLAN service the console's Settings WIFI panel and the OTA check ride."

[[modules.device.group]]
files = ["moy_ota.py"]
why = """
The OTA updater (#53). Board-agnostic: its staging directory is a constructor
argument (this console has no SD, so run_desktop passes a path on the internal
VFS) and its board identity comes from the generated `_ota_build.py`. Verified
end to end on this board's glass 2026-08-02."""

[[modules.device.group]]
files = ["moy_webserver.py", "moy_webhost.py"]
why = """
The socket/HTTP/WebSocket transport core that survived the streaming sunset,
plus the "serve the wasm console from this board" handler (plan §3.4's pull
half). Board-agnostic -- the web directory and the SD gate are constructor
arguments. `moy_webserver` imports `web_view_ws`, which the shared denylist
above stages; that pair is the whole reason `tests/test_staging_closure.py`
exists."""
