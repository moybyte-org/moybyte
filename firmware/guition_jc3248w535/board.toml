#  Moybyte board definition -- Guition JC3248W535 (ESP32-S3, 3.5" 320x480)
#  ======================================================================
#
#  The third board, and the first provisioned THROUGH the #202 port kit rather
#  than before it: board.toml + build.sh over tools/esp32_build_lib.sh + the
#  shared FrameLoop, per docs/board_ports_2026-08.md's checklist. Its job in
#  the lineup is to prove the CONTRACTS, not the copies: a new panel class
#  (QSPI AXS15231B -- native/moy_axs, this board's moy_lcd), touch-only input
#  on the fullscreen tier, and the first board where the fullscreen system
#  canvas (320x480 portrait) is not the game canvas (320x240).
#
#  Read `README.md` in this directory for the hardware facts and the bring-up
#  log; the pin provenance is the owner's working ESPHome definition
#  (~/Documents/Work/esphome/JC3248W535.yaml -- pins verified there, tuning
#  deliberately NOT copied; see sdkconfig.board).

[board]
name    = "guition_jc3248w535"
chip    = "esp32s3"
ota     = "guition_s3"      # the board id inside a signed OTA manifest (#53)
tier    = "handheld"
tier_why = """
Fullscreen tier, like the T-Deck, but with TWO canvases: the system surface is
the LANDSCAPE 480x320 glass (the panel is portrait-native with a dead MADCTL
MV, so moy_axs rotates in its band copy -- owner call 2026-08-18) and the
game stays a fixed 320x240 composited 1:1 by wm.FullscreenStackWM's
composite_game -- the seam the P4 runs windowed, run fullscreen for the first
time. `wm_windowed.py` is still the wrong tier here; see its denial below."""

# ---------------------------------------------------------------------------

[panel]
# The GLASS, in inches. Declaring it is how a board opts in to the chrome
# tap-target floor (#203): `chrome.chrome_scale_floor` turns it into the
# smallest scale that keeps a 16px bar icon at `chrome.MIN_TAP_MM`, and the
# shell lays out interactive geometry -- the bar, the ≡ menu's rows, the
# Settings rows, the code editor's symbol keys -- at that scale while every
# glyph stays on the font scale.
#
# This board is why the floor exists. 480x320 on 3.5" is ~165 PPI, so a 16px
# icon is 2.5mm -- physically SMALLER than the T-Deck's, on a board that is
# touch-ONLY. The other lever was tried first and rejected: FONT_SCALE 2 was
# built, shipped and reverted the same day (#202, 2026-08-19) because 1x text
# reads fine on this panel and 2x "looks bad" -- the problem was never
# legibility. `modules/moy_runtime.py`'s PANEL_DIAGONAL_IN carries this number
# to the console; tests/test_board_toml.py pins the two together.
diagonal_in = 3.5

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# Same prune contract as the other boards: `modules/` is build output plus the
# tracked board-authored files, the freeze takes the whole DIRECTORY, and the
# stager deletes untracked strays it did not just stage.
prune = true
keep  = [
  "carts_data.py",   # generated by tools/gen_device_carts.py from system_carts/
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY runtime/*.py; name the ones that must not cross, with the reason.

The whole console stages from stage 0 on this board (the checklist's own
refinement of the T-Deck's stage-2 argument): images along the bring-up ladder
must differ by the subsystem under test, never by a megabyte of frozen
bytecode, so the module set is settled once, here, before any hardware ran.

`tests/test_staging_closure.py` derives this board's frozen set from THIS FILE
and asserts every import of every staged module resolves on this target."""

# -- host-only: identical to the other two boards' lists, a property the
#    closure suite cross-checks rather than a duplication to factor out -------

[[modules.shared.deny]]
file = "host_app.py"
kind = "host-only"
why  = """
The simulator's glue: a pygame window, the mouse/trackball ConsoleDriver, and
`build_workstation()`. It imports the host's world wholesale."""

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeWifi + ConsoleDriver.
make_api itself is ONE body in the shared `cart_api.py` (which DOES stage
here); nothing on a board constructs a fake service or a sim driver."""

[[modules.shared.deny]]
file = "host_canvas.py"
kind = "host-only"
why  = """
Runs the BOARDS' canvas class on CPython. The board has the real one; this is
the adapter that exists only because CPython is not a board."""

[[modules.shared.deny]]
file = "net_binding.py"
kind = "host-only"
why  = """
`moy_net` for CPython: compiles native/moy_net and dlopens it through ctypes.
Here `moy_net` is a compiled-in usermod (native/.staged/moy_net)."""

[[modules.shared.deny]]
file = "moy_input.py"
kind = "host-only"
why  = """
`moy_input` for CPython: compiles native/moy_input and dlopens it through
ctypes. Here `moy_input` is a compiled-in usermod (native/.staged/moy_input)."""

[[modules.shared.deny]]
file = "moy_play.py"
kind = "host-only"
why  = """
`moy_play` for CPython: compiles native/moy_play's Player and dlopens it
through ctypes. Here `moy_play` is the compiled-in `moy_play` usermod (native/.staged/moy_play)."""

[[modules.shared.deny]]
file = "moy_loop.py"
kind = "host-only"
why  = """
`moy_loop` for CPython: compiles native/moy_kernel's frame loop and dlopens it
through ctypes. Here `moy_loop` is part of the compiled-in `moy_kernel` usermod (native/.staged/moy_kernel)."""

[[modules.shared.deny]]
file = "glass_binding.py"
kind = "host-only"
why  = """
`moy_glass` for CPython: compiles native/moy_glass and dlopens it through
ctypes. Here `moy_glass` is a compiled-in usermod (native/.staged/moy_glass)."""

[[modules.shared.deny]]
file = "gfx_binding.py"
kind = "host-only"
why  = """
`moy_gfx` for CPython: compiles `moyhost_gfx.c` and dlopens it via ctypes.
Here `moy_gfx` is a compiled-in usermod (native/.staged/moy_gfx)."""

[[modules.shared.deny]]
file = "lua_binding.py"
kind = "host-only"
why  = "ctypes over libmoy's Lua binding. This board compiles moy_lua + moycore in."

[[modules.shared.deny]]
file = "audio_binding.py"
kind = "host-only"
why  = """
`moy_audio` for CPython: ctypes over native/moy_audio. Audio on this board is
an OPEN stage-5 question (see the moy_audio native denial); when it lands it
will be the usermod, not this."""

[[modules.shared.deny]]
file = "native_build.py"
kind = "host-only"
why  = """
The compile-and-cache helper the host bindings share: subprocess to a C
compiler, hash-keyed .so cache. No compiler on a board."""

[[modules.shared.deny]]
file = "moycore.py"
kind = "host-only"
why  = """
`moycore` for CPython: the module surface `moycore_glue.py` drives, by ctypes
over `lua_binding`. Here `moycore` is the compiled-in usermod (native/.staged/moycore)."""


[[modules.shared.deny]]
file = "wasm_host.py"
kind = "host-only"
why  = """
The host's compiled-cart runner, over `wasm_binding`. The device's is moycore's wasm half, driven by moycore_glue.py over the moy_wasm engine."""

[[modules.shared.deny]]
file = "wasm_binding.py"
kind = "host-only"
why  = """
ctypes over libmoy's wasm import table and WAMR built for Linux, fetched and
compiled on demand -- no compiler, git or cmake on a board."""
[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`. The board's input contract is the frozen `moybyte`
package, staged whole below -- freezing both puts two classes of one name in
one image."""

# -- never on a board ---------------------------------------------------------

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
Builds MOY64's indices 16-63 with CPython's `colorsys` at IMPORT time;
MicroPython has none (verified on P4 glass 2026-08-15). `device_canvas.PAL565`
is the baked twin every board reads instead."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- the file no longer exists (`runtime/canvas.py`, the pure-Python
indexed raster, deleted 2026-08-15). Kept named so its return is a decision."""

# -- tier: real on the desktop tier, wrong on this one ------------------------

[[modules.shared.deny]]
file = "wm_windowed.py"
kind = "tier"
why  = """
The Picotron-style WINDOWED desktop (#73/#105) -- the P4's and the host's
presentation tier. A 3.5" 320x480 handheld runs `wm.FullscreenStackWM`; the
system-vs-game canvas split it DOES share with the desktop tier lives in
composite_game, not in the windowed WM."""

[[modules.shared.deny]]
file = "wm_desk.py"
kind = "tier"
why  = """
The windowed WM's two halves that live in their own files: the desk root
layer and the `WindowChrome` mixin. Only `wm_windowed.py` imports either, so
with it denied above they would freeze bytes nothing imports -- the same
reasoning as for `wm_windowed.py` itself."""

[[modules.shared.deny]]
file = "wm_chrome.py"
kind = "tier"
why  = """
See `wm_desk.py` above: the other half of the windowed WM, imported only by
`wm_windowed.py`."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
Browser event batches -> InputState/Pointer; today's only importer is the wasm
head's web_boot.py. This board SERVES the wasm console (moy_webhost) -- it
does not decode its input. Flip this the day it does."""

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62), staged under the name `device_canvas`
imports -- device text rasterizes from the same bytes the host draws from."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py (#202 Phase A). S3 bootloader offset 0x0, and
# the S3 partition layout's otadata at 0x1D000 (both S3 boards share it; only
# the P4 differs, at 0xd000) -- erased first so a board that has OTA'd boots
# the slot the cable flash just wrote. No `before` yet: this board's native
# USB-Serial/JTAG has not been seen to need the T-Deck's usb_reset workaround;
# declare it here the day a wedged flash proves otherwise.
image          = "dist/guition_s3/moybyte_guition_s3.bin"
offset         = "0x0"
baud           = 460800
otadata_offset = "0x1d000"
otadata_size   = "0x2000"

[serial]
# Read by tools/push_cart.py. This board's USB-Serial/JTAG is ON the SoC, which
# inverts the P4's rule: opening with dtr/rts LOW is a CHIP RESET (rst:0x15,
# the T-Deck's measured rst:0x15) after which the USB device re-enumerates under the open
# handle and every read returns nothing forever. Attach with both ASSERTED --
# pyserial's default, and what miniterm does.
dtr         = true
rts         = true
# ATTACH ONLY: never pulse the line to reset. tools/p4_autotest.py's reset() is
# CH343-specific; on this board it strands the handle, which is why the on-glass
# suite attaches and leaves the console where it found it.
attach_only = true
# The USB device identity (see the P4's [serial] for the full why: ttyACM
# numbers shuffle, and trusting a remembered one drove the wrong board on
# 2026-08-24). 303a:1001 is the SoC's own USB-Serial/JTAG, so this id is
# SHARED with the T-Deck -- it narrows the candidates and cannot finish the
# job; the harness settles ambiguity by asking each candidate for its
# `_ota_build.BOARD` (safe here: attach_only boards open without resetting).
usb         = "303a:1001"
# USB backpressures, so the default chunk is safe here -- the same S3 USB-Serial/JTAG part as
# the T-Deck, whose 768 push is measured; untested on this board specifically.
chunk       = 768
# The RAW window (`recv`, the dev channel's 8-bit upload path): how many bytes
# the host may put on the wire before it must wait for the board's ack. Bigger
# than the P4's, and for a different reason -- this board's USB-Serial/JTAG
# ISR only drains what the stdin ring has room for, so the endpoint stalls and
# the HOST blocks; the window here buys fewer round trips, it is not the safety
# margin it is on the P4. The ceiling is the board's own RECV_MAX_WINDOW
# (dev_channel), and the window is also the buffer it allocates. The board acks
# a window before writing it, and its stdin ring is MOY_SERIAL_RING_BYTES
# (mpconfigboard.h), twice this, so the next window lands while the card
# writes the last instead of stalling at the port's 260-byte ring.
window      = 16384

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

[native]
dest = "native/.staged"

[native.impl]
spine = "c"
why = """
The kernel's spine (docs/kernel_spine_2026-10.md) is native on this console: its
handle tables, app registry, back-stack, WiFi leases and settings rows are
native/moy_spine, and runtime/moy_spine.py, its Python twin, is not frozen into
the image (`import moy_spine` reaches the extensible builtin). tools/
esp32_build_lib.sh exports each value here as MOY_<NAME>_IMPL unless the build's
environment sets one: MOY_SPINE_IMPL=py builds the twin in again, which is how
`tools/moy_index_spike.py sizes` measures the difference. Every console takes
it; the Zero declares none, because it has no console to route."""

[native.shared]
source   = "native"
why = """
The C-module twin of [modules.shared] (#161; the T-Deck's board.toml carries
the mechanism). Every directory under native/ with a micropython.cmake crosses
unless denied here; this board's own moy_axs lives in its board tree and is
not staged. The denial below is a bring-up staging decision, named with the
stage that revisits it. moy_sd crosses: the TF card on SPI3 is opened by it
and read through native/moy_store's card volume."""

[[native.shared.deny]]
module = "moy_audio"
why = """
Audio is stage 5 and OPEN: the board family ships a speaker header, but which
amp (if any) is populated and on which I2S pins is unverified -- the ESPHome
definition drives no audio. moy_audio's synth half is board-agnostic; its I2S
plumbing wants pins nobody has measured (mpconfigboard.h names none). Take it
at stage 5 with the pins in mpconfigboard.h."""

[[native.shared.take]]
module = "moy_wasm"
why = """
The WebAssembly cart tier's engine (docs/wasm_tier_plan_2026-09.md): the
vendored WAMR runtime, AOT only, and the thread a module runs on. The tier
ships on every console board or on none, so this board takes it. It is the
floor board for memory, and the on-glass suite's wasm checks are the gate on
it. The run stack's size and placement are this board's MOY_WASM_* settings in
mpconfigboard.h, with the measurement that chose them."""

[[native.shared.take]]
module = "moy_play"
why = """
The kernel's Player (docs/kernel_cartpath_2026-10.md): the tick model, the
runtime map and the VM-free rule, and the module `moy_play`. Every console
takes it."""

[[native.shared.take]]
module = "moy_kernel"
why = """
The kernel's entry, crash record and recovery floor
(docs/kernel_spine_2026-10.md §6-§8): taking it is what makes the kernel own
app_main. Every console takes it; what is this board's is in mpconfigboard.h --
the panel module's four entry points the floor draws through, and the AXS15231
touch, polled from C as the floor's input beside serial."""

[[native.shared.take]]
module = "moy_glass"
why = """
The glass's native home (docs/kernel_survival_2026-10.md section 3): canvas
rows, the buffer table, the pool and present. It compiles to nothing until pass
1 of sprint 3 gives it its sources; it is taken now so that pass changes no
build list. Every console takes it."""

[[native.shared.take]]
module = "moy_input"
why = """
Input's native home (docs/kernel_survival_2026-10.md section 4): the merged
table, its sources and the drivers below them. It compiles to nothing until
pass 2 of sprint 3 gives it its sources; every console takes it."""

[[native.shared.take]]
module = "moy_net"
why = """
The links' native home (docs/kernel_survival_2026-10.md section 6): WiFi, the
link, the HTTP core, the webhost, the sync RPC and the updater. It compiles to
nothing until pass 2 of sprint 3 gives it its sources; every board with a radio
takes it."""


# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
why = """
The second staging source, and the one that must STAY an allowlist -- same
call as both siblings, same reason: `device/` is the boards' shared device
tier and not every board drives every piece of it. This board's absences, each
a decision: no input driver (the AXS15231 touch is the kernel's,
native/moy_input), no `moybyte_sd.py` (the card has
a host of its own: `card_store.py`, see the moy_sd native denial), no
`device_diag.py`/`moybyte_diag.py` (the T-Deck's offline diag ring exists
because that board's serial RX was dead for months; this board boots with a
live dev channel, so it starts with the P4's print-to-serial arrangement and
earns a ring only if a real debugging session misses one)."""
[[modules.device.group]]
files = ["boot_shell.py"]
why = """
The boot shell's mode ladder, which `modules/moybyte_shell.py` on this board is
now three declarations over: the board's name, the modes it has, and the module
its smokes live in. It was ~20 lines written once per board and byte-identical
after normalising those three, so the ONE-STRING rule, the self-terminating
smokes and the keep-the-REPL guards now land once instead of four times."""

[[modules.device.group]]
files = ["desktop_spine.py", "wire_input.py", "wire_links.py"]
why = """
The console desktop's boot spine: ONE `build_desktop` (the boot order and the
service set every console board wires) and ONE hand-over of the console to
the kernel's frame loop. The four boards' `run_desktop`s
carried the same imports, the same frame-loop construction,
the same `ws.*` service assignments and the same hook names in fifty-four
byte-identical lines each; a board now passes its hardware -- compositor,
canvas, inputs, keyboard, store, constants -- and takes the rest.

The spine constructs each subsystem through its provider: wire_input.py (the
pointer, the keyboards' start, a BLE-keyboard input state) and wire_links.py
(the radio link, the updaters, Get Carts' network, the web console). Audio has
no provider: the kernel's moy_audio needs no construction at boot."""

[[modules.device.group]]
files = ["card_store.py"]
why = """
The cart store on a card that has a bus of its own (tests/test_card_store.py
executes it): `moy_runtime.tf_card` constructs the card on SPI3, `card_store`
mounts it once at boot with `vfs.mount` and returns the `load_carts` hook
`build_desktop` takes. A card that is absent, will not mount, has a filesystem
this build cannot read or cannot be seeded boots on the internal store with one
`SD:` line, and `card_store.STATUS` is the verdict for the dev channel (boot
output is dropped until a host attaches, #201). A failed mount's `deinit()`
frees the SPI host."""

[[modules.device.group]]
files = ["mem_census.py"]
why = """
The memory census the spine marks its boot steps into: inert unless the flash
root holds `/mem_census` (written by `tools/mem_census.py`), which arms the
boot trace and the import timer. The spine imports it, so every board that
takes the spine takes it."""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py"]
why = """
STAGE 1-2 (panel + touch). The drawing backend: DeviceCanvas (RGB565, palette
resolved at draw time -- `moy_dsi` is absent here so PAL565_WIRE resolves to
the byte-SWAPPED PAL565_SW, exactly what moy_axs stores) and the ticks/diag
leaf helpers. The AXS15231 touch driver is the kernel's (native/moy_input)."""

[[modules.device.group]]
files = ["device_api.py", "moycore_glue.py"]
why = """
STAGE 6 (console). The cart namespace's device home: `device_api` re-exports
THE make_api (one body in the shared cart_api.py) and moycore's glue, whose
runs the kernel's Player frames."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "STAGE 6. The WLAN service the Settings WIFI panel and the OTA check ride."


[[modules.device.group]]
files = ["moy_ota.py", "moy_ota_health.py"]
why = """
STAGE 6. The OTA updater (#53). Board-agnostic: the staging directory is a
constructor argument (internal VFS here, the P4 arrangement) and the identity
comes from the generated `_ota_build.py`.
The updater itself is the kernel's (native/moy_net/moy_ota.c: the streaming
HTTP(S) client the updater and Get Carts fetch through, the signature, the
slot); moy_ota.py is its Settings face and the identity, moy_ota_health.py the
boot verdict and the rollback confirm the frame loop drives."""


[[modules.device.group]]
files = ["moy_webhost.py"]
why = """
STAGE 6. The web console's Settings contract over the kernel's webhost
(native/moy_net/moy_webhost.c: the listener, the baked bundle, the store's
pulls and the sync apply, polled with no Python), and the routes the console
answers: PLAY ON DEVICE and the firmware hand-off."""
