#  Moybyte board definition -- Guition JC3248W535 (ESP32-S3, 3.5" 320x480)
#  ======================================================================
#
#  The third board, and the first provisioned THROUGH the #202 port kit rather
#  than before it: board.toml + build.sh over tools/esp32_build_lib.sh + the
#  shared FrameLoop, per docs/board_ports_2026-08.md's checklist. Its job in
#  the lineup is to prove the CONTRACTS, not the copies: a new panel class
#  (QSPI AXS15231B -- native/moy_axs, this board's moy_lcd), touch-only input
#  on the fullscreen tier, and the first board where the fullscreen system
#  canvas (320x480 portrait) is not the game canvas (320x240).
#
#  Read `README.md` in this directory for the hardware facts and the bring-up
#  log; the pin provenance is the owner's working ESPHome definition
#  (~/Documents/Work/esphome/JC3248W535.yaml -- pins verified there, tuning
#  deliberately NOT copied; see sdkconfig.board).

[board]
name    = "guition_jc3248w535"
chip    = "esp32s3"
ota     = "guition_s3"      # the board id inside a signed OTA manifest (#53)
tier    = "handheld"
tier_why = """
Fullscreen tier, like the T-Deck, but with TWO canvases: the system surface is
the LANDSCAPE 480x320 glass (the panel is portrait-native with a dead MADCTL
MV, so moy_axs rotates in its band copy -- owner call 2026-08-18) and the
game stays a fixed 320x240 composited 1:1 by wm.FullscreenStackWM's
composite_game -- the seam the P4 runs windowed, run fullscreen for the first
time. `wm_windowed.py` is still the wrong tier here; see its denial below."""

# ---------------------------------------------------------------------------

[modules]
dest = "modules"

# Same prune contract as the other boards: `modules/` is build output plus the
# tracked board-authored files, the freeze takes the whole DIRECTORY, and the
# stager deletes untracked strays it did not just stage.
prune = true
keep  = [
  "carts_data.py",   # generated by tools/gen_device_carts.py from system_carts/
  "_ota_build.py",   # the OTA channel/version/label/board stamp (#53)
]

[modules.shared]
source   = "runtime"
strategy = "denylist"
why = """
Stage EVERY runtime/*.py; name the ones that must not cross, with the reason.

The whole console stages from stage 0 on this board (the checklist's own
refinement of the T-Deck's stage-2 argument): images along the bring-up ladder
must differ by the subsystem under test, never by a megabyte of frozen
bytecode, so the module set is settled once, here, before any hardware ran.

`tests/test_staging_closure.py` derives this board's frozen set from THIS FILE
and asserts every import of every staged module resolves on this target."""

# -- host-only: identical to the other two boards' lists, a property the
#    closure suite cross-checks rather than a duplication to factor out -------

[[modules.shared.deny]]
file = "host_app.py"
kind = "host-only"
why  = """
The simulator's glue: a pygame window, the mouse/trackball ConsoleDriver, and
`build_workstation()`. It imports the host's world wholesale."""

[[modules.shared.deny]]
file = "host_api.py"
kind = "host-only"
why  = """
The HOST side of the cart-API backend: FakeAudio/FakeWifi + ConsoleDriver.
make_api itself is ONE body in the shared `cart_api.py` (which DOES stage
here); nothing on a board constructs a fake service or a sim driver."""

[[modules.shared.deny]]
file = "host_canvas.py"
kind = "host-only"
why  = """
Runs the BOARDS' canvas class on CPython. The board has the real one; this is
the adapter that exists only because CPython is not a board."""

[[modules.shared.deny]]
file = "gfx_binding.py"
kind = "host-only"
why  = """
`moy_gfx` for CPython: compiles `moyhost_gfx.c` and dlopens it via ctypes.
Here `moy_gfx` is a compiled-in usermod (native/.staged/moy_gfx)."""

[[modules.shared.deny]]
file = "lua_binding.py"
kind = "host-only"
why  = "ctypes over libmoy's Lua binding. This board compiles moy_lua + moycore in."

[[modules.shared.deny]]
file = "audio_binding.py"
kind = "host-only"
why  = """
ctypes over the vendored libmoy synth (#97). Audio on this board is an OPEN
stage-5 question (see the moy_audio native denial); when it lands it will be
the usermod, not this."""

[[modules.shared.deny]]
file = "native_build.py"
kind = "host-only"
why  = """
The compile-and-cache helper the host bindings share: subprocess to a C
compiler, hash-keyed .so cache. No compiler on a board."""

[[modules.shared.deny]]
file = "lua_host.py"
kind = "host-only"
why  = "The host's Lua cart runner. The device's is `moycore`, driven by moycore_glue.py."

[[modules.shared.deny]]
file = "input.py"
kind = "host-only"
why  = """
The host's `InputState`. The board's input contract is the frozen `moybyte`
package, staged whole below -- freezing both puts two classes of one name in
one image."""

# -- never on a board ---------------------------------------------------------

[[modules.shared.deny]]
file = "palette.py"
kind = "never-on-a-board"
why  = """
Builds MOY64's indices 16-63 with CPython's `colorsys` at IMPORT time;
MicroPython has none (verified on P4 glass 2026-08-15). `device_canvas.PAL565`
is the baked twin every board reads instead."""

[[modules.shared.deny]]
file = "canvas.py"
kind = "never-on-a-board"
why  = """
TRIPWIRE -- the file no longer exists (`runtime/canvas.py`, the pure-Python
indexed raster, deleted 2026-08-15). Kept named so its return is a decision."""

# -- tier: real on the desktop tier, wrong on this one ------------------------

[[modules.shared.deny]]
file = "wm_windowed.py"
kind = "tier"
why  = """
The Picotron-style WINDOWED desktop (#73/#105) -- the P4's and the host's
presentation tier. A 3.5" 320x480 handheld runs `wm.FullscreenStackWM`; the
system-vs-game canvas split it DOES share with the desktop tier lives in
composite_game, not in the windowed WM."""

[[modules.shared.deny]]
file = "surface.py"
kind = "tier"
why  = """
Surface model v1's retained-surface object -- a LEAF whose only importers are
`wm_windowed.py` and the web serve glue. With wm_windowed denied above,
staging this would freeze bytes nothing imports."""

# -- no consumer here yet ----------------------------------------------------

[[modules.shared.deny]]
file = "web_input.py"
kind = "no-consumer"
why  = """
Browser event batches -> InputState/Pointer; today's only importer is the wasm
head's web_boot.py. This board SERVES the wasm console (moy_webhost) -- it
does not decode its input. Flip this the day it does. (`web_view_ws.py` IS
staged: `moy_webserver.py` imports it.)"""

# -- staged under another name -----------------------------------------------

[[modules.shared.rename]]
file = "font.py"
as   = "moy_font.py"
why  = """
The petme128 8x8 glyph blob (#62), staged under the name `device_canvas`
imports -- device text rasterizes from the same bytes the host draws from."""

# ---------------------------------------------------------------------------

[flash]
# Read by tools/board_flash.py (#202 Phase A). S3 bootloader offset 0x0, and
# the S3 partition layout's otadata at 0x1D000 (both S3 boards share it; only
# the P4 differs, at 0xd000) -- erased first so a board that has OTA'd boots
# the slot the cable flash just wrote. No `before` yet: this board's native
# USB-Serial/JTAG has not been seen to need the T-Deck's usb_reset workaround;
# declare it here the day a wedged flash proves otherwise.
image          = "dist/guition_s3/moybyte_guition_s3.bin"
offset         = "0x0"
baud           = 460800
otadata_offset = "0x1d000"
otadata_size   = "0x2000"

[serial]
# Read by tools/push_cart.py. This board's USB-Serial/JTAG is ON the SoC, which
# inverts the P4's rule: opening with dtr/rts LOW is a CHIP RESET (rst:0x15,
# the T-Deck's measured rst:0x15) after which the USB device re-enumerates under the open
# handle and every read returns nothing forever. Attach with both ASSERTED --
# pyserial's default, and what miniterm does.
dtr         = true
rts         = true
# ATTACH ONLY: never pulse the line to reset. tools/p4_autotest.py's reset() is
# CH343-specific; on this board it strands the handle, which is why the on-glass
# suite attaches and leaves the console where it found it.
attach_only = true
# USB backpressures, so the default chunk is safe here -- the same S3 USB-Serial/JTAG part as
# the T-Deck, whose 768 push is measured; untested on this board specifically.
chunk       = 768

[monitor]
baud = 115200

# ---------------------------------------------------------------------------

[native]
dest = "native/.staged"

[native.shared]
source   = "native"
strategy = "denylist"
why = """
The C-module twin of [modules.shared] (#161; the T-Deck's board.toml carries
the mechanism). Every directory under native/ with a micropython.cmake crosses
unless denied here; this board's own moy_axs lives in its board tree and is
not staged. The two denials below are bring-up staging decisions, each named
with the stage that revisits it."""

[[native.shared.deny]]
module = "moy_sd"
why = """
SD is stage 4 of this board's checklist and stage 4 has not run: the JC3248W535
has a TF slot but its pins are not in the verified ESPHome definition, and
moy_sd's whole reason to exist -- attaching a card to a host the T-Deck's
moy_lcd already initialised, on a SHARED SPI bus -- names a topology this board
may not even have (nothing else is known to share the panel's QSPI host).
Carts live on the internal-flash VFS (/moy/carts, the P4 arrangement) until
stage 4 decides; flip this with measured pins and a mount that survived a
panel flush."""

[[native.shared.deny]]
module = "moy_audio"
why = """
Audio is stage 5 and OPEN: the board family ships a speaker header, but which
amp (if any) is populated and on which I2S pins is unverified -- the ESPHome
definition drives no audio. moy_audio's synth half is board-agnostic; its I2S
plumbing wants pins nobody has measured. device_audio.py is likewise absent
from this board's device allowlist. Flip both together at stage 5."""

# ---------------------------------------------------------------------------

[modules.device]
source   = "device"
strategy = "allowlist"
why = """
The second staging source, and the one that must STAY an allowlist -- same
call as both siblings, same reason: `device/` is the boards' shared device
tier and not every board drives every piece of it. This board's absences, each
a decision: no `device_input.py` (there is no trackball and no I2C keyboard;
the touch part is an AXS15231 on its own shared driver below -- `gt911.py`
DOES stage, but only for the `HeldPoint` that driver imports, never for its
GT911 register map, see that group's why), no `moybyte_sd.py` (stage 4, see
the moy_sd native denial), no `device_audio.py` (stage 5, see moy_audio), no
`device_diag.py`/`moybyte_diag.py` (the T-Deck's offline diag ring exists
because that board's serial RX was dead for months; this board boots with a
live dev channel, so it starts with the P4's print-to-serial arrangement and
earns a ring only if a real debugging session misses one)."""
packages = ["moybyte"]
packages_why = """
`moybyte/` is directory-shaped: `moybyte.input` is the boards' real InputState.
This board constructs InputState only -- the T-Deck keyboard matrix and the
#69 InputPoller ride along frozen-but-unconstructed, which is the P4's
arrangement too and costs flash, not RAM. The doc's input-contract split
("separable InputState core") stays on the table for the day the rider weight
bothers someone; it did not block the port, so per the rule it was not done
ahead of need."""

[[modules.device.group]]
files = ["device_util.py", "device_canvas.py", "axs_touch.py", "gt911.py"]
why = """
STAGE 1-2 (panel + touch). The drawing backend and this board's pointer:
DeviceCanvas (RGB565, palette resolved at draw time -- `moy_dsi` is absent
here so PAL565_WIRE resolves to the byte-SWAPPED PAL565_SW, exactly what
moy_axs stores), the ticks/diag leaf helpers, and the AXS15231 touch driver --
new hardware, so it starts life IN the shared tree (Phase C's rule) with this
board passing its pins/geometry as constructor arguments. `gt911.py` crosses
for its `HeldPoint` -- the promoted no-news contract axs_touch imports (all
three clauses; a flaky I2C read must hold, stale, bounded) -- NOT for its
GT911 register map, which nothing here reads. If the misleading home ever
bothers someone, the move is HeldPoint out to a neutral module, never a copy."""

[[modules.device.group]]
files = ["device_api.py", "moycore_glue.py"]
why = """
STAGE 6 (console). The cart namespace's device home: `device_api` re-exports
THE make_api (one body in the shared cart_api.py) and moycore's host half."""

[[modules.device.group]]
files = ["ble_keyboard.py"]
why = """
The BLE HID keyboard -- the shared driver (promoted from the P4's tree
2026-08-19, this board being the second consumer that fired the Phase C
rule). The S3's radio is on-chip and `import bluetooth` is already in this
image (sdkconfig.ble); the P4-local moy_ble_hid fast-path is absent here on
purpose -- the driver's guarded import runs the ordinary notification path,
and whether this board ever needs the fast-path is an on-glass measurement.
Also this board's first game-EXIT path: hold-BACKSPACE works once a keyboard
is paired (the touch-only gesture stays open on #202 for keyboard-less use)."""

[[modules.device.group]]
files = ["device_wifi.py"]
why = "STAGE 6. The WLAN service the Settings WIFI panel and the OTA check ride."

[[modules.device.group]]
files = ["moy_ota.py"]
why = """
STAGE 6. The OTA updater (#53). Board-agnostic: the staging directory is a
constructor argument (internal VFS here, the P4 arrangement) and the identity
comes from the generated `_ota_build.py`."""

[[modules.device.group]]
files = ["moy_webserver.py", "moy_webhost.py"]
why = """
STAGE 6. The socket/HTTP/WS transport core plus the "serve the wasm console
from this board" handler; `moy_webserver` imports `web_view_ws`, which the
shared denylist above stages."""
