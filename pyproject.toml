[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moybyte"
version = "0.1.0"
description = "Moybyte: an operating system for ESP32 boards, plus its host simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# `make setup` installs dev + sim: the test suite and the simulator window. BOTH
# cart languages still run from a fresh clone -- Lua needs no dependency now, it
# needs a C COMPILER, which is already true of audio (runtime/audio_binding).
dev = [
  "pytest",
  "pytest-xdist", # `make test` runs the ~2000 host tests across cores (3m25s -> ~40s)
  "pillow",       # GIF export: tools/make_site_gifs.py + simulate_desktop.py --gif
]
sim = [
  "pygame>=2.5",  # the live simulator window (tools/simulate_desktop.py, moybyte run)
]
# (There was a `lua` extra here carrying lupa, the host's second Lua VM. It is
# GONE as of 2026-08-14: the host runs the BOARDS' Lua -- libmoy's binding over
# the same vendored 5.4, built on demand by runtime/lua_binding -- so a Lua cart
# needs a C compiler rather than a wheel, exactly as host audio already does.
# See runtime/lua_host.py's module docstring for why two engines was worse than
# one requirement.)
# Flashing/monitoring a real board. NOT installed by `make setup` -- it needs
# hardware, and the T-Deck targets use the ESP-IDF toolchain's python instead.
device = [
  "esptool>=4.7,<5",   # tools/esptool_no_modem.py patches esptool 4.x internals
  "pyserial>=3.5",     # serial monitor + tools/p4_autotest.py (on-glass tests)
  "mpremote",          # firmware/seeed_xiao_esp32s3_zero/stage.sh
]
# SIGNING an OTA manifest (tools/ota_sign.py keygen/sign). Not in `make setup`:
# only the release publisher needs it, and only for the private-key half.
# VERIFYING needs nothing -- it is pow() and a byte compare, which is exactly
# why the device can do it too.
release = [
  "cryptography>=41",
]

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Foreign pytest plugins reachable from PYTHONPATH are refused rather than
# imported. A ROS install exports /opt/ros/.../site-packages, which carries
# launch_testing + launch_testing_ros; their hook signatures are years stale and
# pluggy rejects them at registration, so `pytest` dies before collecting a
# single test on a machine that merely HAS ROS installed. We depend on no pytest
# plugin except xdist (loaded explicitly by `make test`), so there is nothing to
# lose. `-p no:NAME` for a plugin that isn't installed is a no-op.
#
# These are ENTRY-POINT names, not package names -- launch-testing-ros registers
# itself as `launch_ros`, so blocking "launch_testing_ros" silently does nothing.
# List what is actually reachable with:
#   python -c "import importlib.metadata as m; print(sorted(e.name for d in m.distributions() for e in d.entry_points if e.group=='pytest11'))"
# `make test` additionally sets PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 -- the blanket
# version of this, which needs no updating when a new stale plugin shows up.
addopts = "-p no:launch_testing -p no:launch_ros"
