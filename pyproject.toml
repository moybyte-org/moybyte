[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "moybyte"
version = "0.1.0"
description = "Moybyte: an operating system for ESP32 boards, plus its host simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# `make setup` installs dev + sim + lua: the test suite, the simulator window and
# BOTH cart languages are what a fresh clone is expected to be able to run.
dev = [
  "pytest",
  "pillow",       # GIF export: tools/make_site_gifs.py + simulate_desktop.py --gif
]
sim = [
  "pygame>=2.5",  # the live simulator window (tools/simulate_desktop.py, moybyte run)
]
# The HOST's Lua tier (#67): runtime/lua_host.py runs a "runtime": "lua" cart on a
# real Lua 5.4 VM, the device's moy_lua native module's opposite number. Its own
# extra rather than part of `sim` because it is genuinely optional -- python carts
# never touch it, and a lua cart without it opens the runtime-missing panel rather
# than failing. Unpinned: lua_host prefers lupa 2.x's `lupa.lua54` and falls back
# to the top-level LuaRuntime on older wheels.
lua = [
  "lupa",
]
# Flashing/monitoring a real board. NOT installed by `make setup` -- it needs
# hardware, and the T-Deck targets use the ESP-IDF toolchain's python instead.
device = [
  "esptool>=4.7,<5",   # tools/esptool_no_modem.py patches esptool 4.x internals
  "pyserial>=3.5",     # serial monitor + tools/p4_autotest.py (on-glass tests)
  "mpremote",          # firmware/seeed_xiao_esp32s3_zero/stage.sh
]
# SIGNING an OTA manifest (tools/ota_sign.py keygen/sign). Not in `make setup`:
# only the release publisher needs it, and only for the private-key half.
# VERIFYING needs nothing -- it is pow() and a byte compare, which is exactly
# why the device can do it too.
release = [
  "cryptography>=41",
]

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
