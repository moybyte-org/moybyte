# cargo-fuzz's target for the Rust twin: the safe API against a model, under
# AddressSanitizer and libFuzzer, both from the pinned nightly's own LLVM.
#   cargo +nightly-2026-10-05 fuzz run api   (from native/moy_index/rust)
[package]
name = "moy_index_rs_fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
moy_index_rs = { path = ".." }

[[bin]]
name = "api"
path = "fuzz_targets/api.rs"
test = false
doc = false
bench = false

[workspace]
