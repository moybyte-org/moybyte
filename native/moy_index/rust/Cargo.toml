[package]
name = "moy_index_rs"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# A staticlib for every image (build.sh selects it with --crate-type), an rlib
# for `cargo test` and Miri.
crate-type = ["rlib"]
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
# build.sh sets opt-level per target to the C twin's: ESP-IDF's -O2 on the
# boards, MicroPython's -Os on the desktop and in the browser.
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
